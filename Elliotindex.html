<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FFF8E7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="숙제">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>숙제 체크리스트</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  body {
    font-family: 'Gowun Dodum', sans-serif;
    background: #FFF8E7;
    background-image: 
      radial-gradient(circle at 20% 30%, rgba(255, 200, 100, 0.15) 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(100, 200, 255, 0.15) 0%, transparent 50%);
    min-height: 100vh;
    padding: 20px 14px 40px;
    padding-top: max(20px, env(safe-area-inset-top));
    padding-bottom: max(40px, env(safe-area-inset-bottom));
    color: #3D2817;
    width: 100%;
    max-width: 100vw;
    overflow-x: hidden;
  }
  
  .container { max-width: 480px; margin: 0 auto; width: 100%; }
  
  .header { text-align: center; margin-bottom: 16px; display: flex; align-items: center; justify-content: center; gap: 10px; }
  
  .header h1 {
    font-family: 'Gaegu', cursive;
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -1px;
  }
  
  .settings-btn {
    background: white;
    border: 2px solid #3D2817;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 2px 2px 0 #3D2817;
  }
  
  .top-bar { display: flex; gap: 10px; margin-bottom: 18px; }
  
  .coin-display {
    flex: 1;
    background: linear-gradient(135deg, #FFD93D, #FFB84D);
    border: 3px solid #3D2817;
    border-radius: 16px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 4px 4px 0 #3D2817;
  }
  
  .coin-icon { font-size: 28px; animation: spin 4s linear infinite; }
  
  @keyframes spin {
    0%, 90%, 100% { transform: rotateY(0deg); }
    95% { transform: rotateY(360deg); }
  }
  
  .coin-amount { font-family: 'Gaegu', cursive; font-size: 26px; font-weight: 700; }
  .coin-label { font-family: 'Gaegu', cursive; font-size: 14px; color: #6B4423; margin-top: -4px; }
  
  .shop-btn {
    background: #C44536;
    border: 3px solid #3D2817;
    border-radius: 16px;
    padding: 10px 16px;
    font-family: 'Gaegu', cursive;
    font-size: 18px;
    color: white;
    cursor: pointer;
    box-shadow: 4px 4px 0 #3D2817;
  }
  
  .shop-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #3D2817; }
  
  .calendar-card {
    background: white;
    border: 3px solid #3D2817;
    border-radius: 16px;
    padding: 12px;
    margin-bottom: 20px;
    box-shadow: 4px 4px 0 #3D2817;
    overflow: hidden;
  }
  
  .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  
  .cal-nav {
    background: #FFE8B6;
    border: 2px solid #3D2817;
    border-radius: 10px;
    width: 36px;
    height: 36px;
    font-family: 'Gaegu', cursive;
    font-size: 20px;
    cursor: pointer;
    font-weight: 700;
  }
  
  .cal-title { font-family: 'Gaegu', cursive; font-size: 24px; font-weight: 700; }
  
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; width: 100%; }
  
  .cal-day-name {
    text-align: center;
    font-family: 'Gaegu', cursive;
    font-size: 14px;
    font-weight: 700;
    color: #8B6F47;
    padding: 4px 0;
  }
  
  .cal-day-name.sun { color: #C44536; }
  .cal-day-name.sat { color: #4A89C4; }
  
  .cal-cell {
    aspect-ratio: 1;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-family: 'Gaegu', cursive;
    font-size: 16px;
    font-weight: 700;
    background: #FFF4D6;
    border: 2px solid transparent;
    position: relative;
    transition: all 0.15s;
    padding-top: 4px;
    padding-bottom: 8px;
    min-width: 0;
    box-sizing: border-box;
    overflow: hidden;
  }
  
  .cal-cell:active { transform: scale(0.95); }
  .cal-cell.empty { background: transparent; cursor: default; }
  
  .cal-cell.today { border-color: #E07B39; background: #FFD93D; }
  .cal-cell.selected { background: #3D2817; color: #FFF8E7; border-color: #3D2817; }
  
  /* 물 차오르는 게이지 (셀 전체) */
  .cell-gauge {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    background: #C44536;
    border-radius: 0 0 8px 8px;
    transition: height 0.4s ease;
    pointer-events: none;
  }
  
  .cell-gauge.h25 { height: 25%; }
  .cell-gauge.h50 { height: 50%; }
  .cell-gauge.h75 { height: 75%; }
  .cell-gauge.h100 { height: 100%; border-radius: 8px; }
  
  /* 25/50/75% 가로 구분선 (흰색, 두꺼움) */
  .cal-cell.gauge-lines::before {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    bottom: 0;
    pointer-events: none;
    background-image: 
      linear-gradient(to bottom, transparent calc(25% - 2px), rgba(255,255,255,0.9) 25%, transparent calc(25% + 2px)),
      linear-gradient(to bottom, transparent calc(50% - 2px), rgba(255,255,255,0.9) 50%, transparent calc(50% + 2px)),
      linear-gradient(to bottom, transparent calc(75% - 2px), rgba(255,255,255,0.9) 75%, transparent calc(75% + 2px));
    z-index: 1;
    border-radius: 8px;
  }
  
  .cal-cell .day-num { position: relative; z-index: 2; }
  
  /* 완료 + 엄마 확인 */
  .cal-cell.all-confirmed { background: #A8E6A1; }
  .cal-cell.all-confirmed::after {
    content: '🐶';
    position: absolute;
    bottom: 2px;
    font-size: 14px;
    line-height: 1;
  }
  .cal-cell.all-confirmed .cell-gauge { display: none; }
  
  .cal-cell.selected.all-confirmed { background: #3D2817; }
  
  .cal-cell.sun { color: #C44536; }
  .cal-cell.sat { color: #4A89C4; }
  .cal-cell.selected.sun, .cal-cell.selected.sat { color: #FFF8E7; }
  
  .selected-date {
    text-align: center;
    margin-bottom: 14px;
    font-family: 'Gaegu', cursive;
    font-size: 22px;
    font-weight: 700;
  }
  
  .subject {
    background: white;
    border: 3px solid #3D2817;
    border-radius: 16px;
    margin-bottom: 12px;
    overflow: hidden;
    box-shadow: 4px 4px 0 #3D2817;
  }
  
  .subject-header {
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 2px dashed #D4B896;
  }
  
  .subject-icon { font-size: 24px; }
  .subject-name { font-family: 'Gaegu', cursive; font-size: 22px; font-weight: 700; flex: 1; }
  .subject-status { font-size: 13px; color: #8B6F47; }
  
  .task-list { padding: 6px 0; }
  
  .task {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    cursor: pointer;
    user-select: none;
  }
  
  .task:active { background: #FFF4D6; }
  
  .checkbox {
    width: 26px;
    height: 26px;
    border: 3px solid #3D2817;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    background: white;
    transition: all 0.2s;
  }
  
  .task.done .checkbox { background: #6BAA75; }
  .task.done .checkbox::after { content: '✓'; color: white; font-weight: bold; font-size: 18px; }
  
  .task-input {
    flex: 1;
    border: none;
    background: transparent;
    font-family: 'Gowun Dodum', sans-serif;
    font-size: 15px;
    color: #3D2817;
    outline: none;
    padding: 4px 0;
  }
  
  .task.done .task-input { text-decoration: line-through; color: #A8916D; }
  
  .delete-btn {
    background: none;
    border: none;
    color: #C44536;
    font-size: 18px;
    cursor: pointer;
    padding: 4px 8px;
    opacity: 0.5;
  }
  
  .add-btn {
    width: 100%;
    padding: 10px;
    background: #FFF4D6;
    border: none;
    border-top: 2px dashed #D4B896;
    font-family: 'Gaegu', cursive;
    font-size: 16px;
    color: #8B6F47;
    cursor: pointer;
  }
  
  .add-btn:active { background: #FFE8B6; color: #3D2817; }
  
  /* 엄마 확인 카드 */
  .mom-card {
    background: white;
    border: 3px solid #3D2817;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: 4px 4px 0 #3D2817;
    text-align: center;
  }
  
  .mom-card.confirmed {
    background: linear-gradient(135deg, #FFE8B6, #A8E6A1);
  }
  
  .mom-title {
    font-family: 'Gaegu', cursive;
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 10px;
  }
  
  .mom-btn {
    background: #E07B39;
    color: white;
    border: 3px solid #3D2817;
    border-radius: 12px;
    padding: 10px 24px;
    font-family: 'Gaegu', cursive;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 3px 3px 0 #3D2817;
  }
  
  .mom-btn:disabled {
    background: #B8B8B8;
    cursor: not-allowed;
  }
  
  .mom-confirmed-text {
    font-family: 'Gaegu', cursive;
    font-size: 22px;
    font-weight: 700;
    color: #3D2817;
    line-height: 1.4;
  }
  
  .mom-confirmed-text .heart {
    color: #C44536;
    font-size: 26px;
  }
  
  .dog-reward {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: white;
    border: 4px solid #3D2817;
    border-radius: 20px;
    padding: 12px 18px;
    box-shadow: 6px 6px 0 #3D2817;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: opacity 0.3s;
    z-index: 200;
    max-width: 320px;
    opacity: 0;
    pointer-events: none;
    cursor: pointer;
  }
  
  .dog-reward.show {
    opacity: 1;
    pointer-events: auto;
  }
  
  .dog-face { font-size: 36px; animation: wiggle 0.5s ease infinite; }
  
  @keyframes wiggle {
    0%, 100% { transform: rotate(-8deg); }
    50% { transform: rotate(8deg); }
  }
  
  .dog-msg { font-family: 'Gaegu', cursive; font-size: 16px; font-weight: 700; line-height: 1.3; }
  
  .flying-coin {
    position: fixed;
    font-size: 32px;
    z-index: 199;
    pointer-events: none;
    transition: all 0.8s cubic-bezier(0.5, -0.5, 0.5, 1);
  }
  
  .modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(61, 40, 23, 0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 300;
    padding: 20px;
  }
  
  .modal-bg.show { display: flex; }
  
  .modal {
    background: #FFF8E7;
    border: 4px solid #3D2817;
    border-radius: 20px;
    padding: 24px;
    max-width: 380px;
    width: 100%;
    box-shadow: 8px 8px 0 #3D2817;
    max-height: 85vh;
    overflow-y: auto;
  }
  
  .modal-title { font-family: 'Gaegu', cursive; font-size: 28px; font-weight: 700; text-align: center; margin-bottom: 8px; }
  .modal-sub { text-align: center; margin-bottom: 20px; font-family: 'Gaegu', cursive; font-size: 18px; color: #E07B39; }
  
  .shop-item {
    background: white;
    border: 3px solid #3D2817;
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 3px 3px 0 #3D2817;
  }
  
  .shop-item-icon { font-size: 36px; }
  .shop-item-info { flex: 1; }
  .shop-item-name { font-family: 'Gaegu', cursive; font-size: 20px; font-weight: 700; }
  .shop-item-price { font-family: 'Gaegu', cursive; font-size: 16px; color: #E07B39; }
  
  .buy-btn {
    background: #6BAA75;
    border: 2px solid #3D2817;
    color: white;
    font-family: 'Gaegu', cursive;
    font-size: 16px;
    font-weight: 700;
    padding: 8px 14px;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: 2px 2px 0 #3D2817;
  }
  
  .buy-btn:disabled { background: #B8B8B8; cursor: not-allowed; }
  
  .modal-close {
    width: 100%;
    margin-top: 8px;
    padding: 10px;
    background: #3D2817;
    color: white;
    border: none;
    border-radius: 10px;
    font-family: 'Gaegu', cursive;
    font-size: 18px;
    cursor: pointer;
  }
  
  .owned-tickets {
    background: #FFE8B6;
    border: 2px dashed #8B6F47;
    border-radius: 12px;
    padding: 10px;
    margin-bottom: 16px;
  }
  
  .owned-title { font-family: 'Gaegu', cursive; font-size: 16px; font-weight: 700; margin-bottom: 6px; color: #6B4423; }
  .owned-list { font-family: 'Gaegu', cursive; font-size: 15px; }
  .owned-empty { color: #A8916D; font-style: italic; }
  
  .pwd-input {
    width: 100%;
    padding: 12px;
    border: 3px solid #3D2817;
    border-radius: 12px;
    font-family: 'Gaegu', cursive;
    font-size: 22px;
    text-align: center;
    margin-bottom: 12px;
    letter-spacing: 8px;
    outline: none;
  }
  
  .pwd-input:focus { border-color: #E07B39; }
  
  .modal-btns { display: flex; gap: 8px; }
  
  .modal-btn {
    flex: 1;
    padding: 12px;
    border: 3px solid #3D2817;
    border-radius: 12px;
    font-family: 'Gaegu', cursive;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 3px 3px 0 #3D2817;
  }
  
  .modal-btn.primary { background: #6BAA75; color: white; }
  .modal-btn.cancel { background: white; color: #3D2817; }
  
  .pwd-error {
    color: #C44536;
    text-align: center;
    font-family: 'Gaegu', cursive;
    font-size: 16px;
    margin-bottom: 10px;
    min-height: 22px;
  }
  
  .toast {
    position: fixed;
    top: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(-100px);
    background: #6BAA75;
    color: white;
    padding: 14px 24px;
    border: 3px solid #3D2817;
    border-radius: 14px;
    font-family: 'Gaegu', cursive;
    font-size: 18px;
    font-weight: 700;
    box-shadow: 4px 4px 0 #3D2817;
    transition: transform 0.4s;
    z-index: 400;
  }
  
  .toast.show { transform: translateX(-50%) translateY(0); }
  
  .sound-toggle {
    position: fixed;
    top: 20px;
    right: 20px;
    background: white;
    border: 2px solid #3D2817;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    z-index: 50;
    box-shadow: 2px 2px 0 #3D2817;
  }
</style>
</head>
<body>

<button class="sound-toggle" id="soundToggle" onclick="toggleSound()">🔊</button>

<div class="container">
  <div class="header">
    <h1>📚 숙제 체크리스트</h1>
    <button class="settings-btn" onclick="openSettings()">⚙️</button>
  </div>
  
  <div class="top-bar">
    <div class="coin-display">
      <span class="coin-icon">🪙</span>
      <div style="flex:1;">
        <div class="coin-amount" id="coinAmount">0</div>
        <div class="coin-label">내 코인 <span id="pendingLabel" style="color:#C44536;"></span></div>
      </div>
    </div>
    <button class="shop-btn" onclick="openShop()">🎁<br>상점</button>
  </div>
  
  <div class="calendar-card">
    <div class="cal-header">
      <button class="cal-nav" onclick="changeMonth(-1)">‹</button>
      <div class="cal-title" id="calTitle"></div>
      <button class="cal-nav" onclick="changeMonth(1)">›</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>
  
  <div class="selected-date" id="selectedDate"></div>
  
  <div id="subjects"></div>
  
  <div id="momSection"></div>
</div>

<div class="dog-reward" id="dogReward" onclick="hideDogMsg()">
  <div class="dog-face">🐶</div>
  <div class="dog-msg" id="dogMsg"></div>
</div>

<!-- 상점 -->
<div class="modal-bg" id="shopModal" onclick="if(event.target===this)closeShop()">
  <div class="modal">
    <div class="modal-title">🎁 코인 상점</div>
    <div class="modal-sub">내 코인: <span id="modalCoin">0</span> 🪙</div>
    
    <div class="owned-tickets">
      <div class="owned-title">🎟️ 보유 이용권</div>
      <div class="owned-list" id="ownedList"></div>
    </div>
    
    <div class="shop-item">
      <span class="shop-item-icon">🥓</span>
      <div class="shop-item-info">
        <div class="shop-item-name">삼겹살 먹기 이용권</div>
        <div class="shop-item-price">30 🪙</div>
      </div>
      <button class="buy-btn" id="buy-samgyup" onclick="buyItem('samgyup', 30, '🥓 삼겹살 이용권')">구매</button>
    </div>
    
    <div class="shop-item">
      <span class="shop-item-icon">🎮</span>
      <div class="shop-item-info">
        <div class="shop-item-name">PC방 이용권</div>
        <div class="shop-item-price">20 🪙</div>
      </div>
      <button class="buy-btn" id="buy-pcbang" onclick="buyItem('pcbang', 20, '🎮 PC방 이용권')">구매</button>
    </div>
    
    <button class="modal-close" onclick="closeShop()">닫기</button>
  </div>
</div>

<!-- 엄마 확인 비밀번호 입력 -->
<div class="modal-bg" id="momPwdModal" onclick="if(event.target===this)closeMomPwd()">
  <div class="modal">
    <div class="modal-title">👩 엄마 확인</div>
    <div class="modal-sub">비밀번호를 입력하세요</div>
    <input type="password" class="pwd-input" id="momPwdInput" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="● ● ● ●">
    <div class="pwd-error" id="momPwdError"></div>
    <div class="modal-btns">
      <button class="modal-btn cancel" onclick="closeMomPwd()">취소</button>
      <button class="modal-btn primary" onclick="checkMomPwd()">확인</button>
    </div>
  </div>
</div>

<!-- 설정 (비밀번호 변경) -->
<div class="modal-bg" id="settingsModal" onclick="if(event.target===this)closeSettings()">
  <div class="modal">
    <div class="modal-title">⚙️ 설정</div>
    <div class="modal-sub">엄마 확인 비밀번호 변경</div>
    
    <div style="font-family:'Gaegu',cursive;font-size:16px;margin-bottom:4px;">현재 비밀번호</div>
    <input type="password" class="pwd-input" id="curPwdInput" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="● ● ● ●">
    
    <div style="font-family:'Gaegu',cursive;font-size:16px;margin-bottom:4px;">새 비밀번호 (4자리)</div>
    <input type="password" class="pwd-input" id="newPwdInput" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="● ● ● ●">
    
    <div class="pwd-error" id="settingsError"></div>
    <div class="modal-btns">
      <button class="modal-btn cancel" onclick="closeSettings()">취소</button>
      <button class="modal-btn primary" onclick="changePwd()">변경</button>
    </div>
    
    <div style="margin-top:16px;text-align:center;">
      <button onclick="openResetPwd()" style="background:none;border:none;color:#8B6F47;font-family:'Gaegu',cursive;font-size:15px;text-decoration:underline;cursor:pointer;">
        비밀번호를 잊어버렸어요
      </button>
    </div>
  </div>
</div>

<!-- 비밀번호 초기화 (마스터 코드) -->
<div class="modal-bg" id="resetPwdModal" onclick="if(event.target===this)closeResetPwd()">
  <div class="modal">
    <div class="modal-title">🔑 비밀번호 초기화</div>
    <div class="modal-sub">마스터 코드를 입력하세요</div>
    <input type="password" class="pwd-input" id="masterCodeInput" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="● ● ● ●">
    <div class="pwd-error" id="resetPwdError"></div>
    <div class="modal-btns">
      <button class="modal-btn cancel" onclick="closeResetPwd()">취소</button>
      <button class="modal-btn primary" onclick="resetPwd()">초기화</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ====== 사운드 ====== */
let audioCtx = null;
let soundOn = true;

function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function playTone(freq, duration, type = 'sine', volume = 0.15) {
  if (!soundOn) return;
  initAudio();
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(volume, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function soundCheck() {
  playTone(1200, 0.15, 'sine', 0.2);
  setTimeout(() => playTone(1600, 0.2, 'sine', 0.15), 80);
}
function soundCoin() {
  playTone(800, 0.08, 'square', 0.1);
  setTimeout(() => playTone(1200, 0.1, 'square', 0.1), 60);
  setTimeout(() => playTone(1600, 0.15, 'square', 0.08), 120);
}
function soundFanfare() {
  [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => playTone(f, 0.2, 'triangle', 0.18), i * 100));
}
function soundBonus() {
  [523, 659, 784, 880, 1047].forEach((f, i) => setTimeout(() => playTone(f, 0.15, 'sine', 0.15), i * 80));
}
function soundClick() { playTone(600, 0.05, 'sine', 0.08); }
function soundError() { playTone(300, 0.2, 'sawtooth', 0.1); }

function toggleSound() {
  soundOn = !soundOn;
  document.getElementById('soundToggle').textContent = soundOn ? '🔊' : '🔇';
  localStorage.setItem('soundOn', soundOn);
  if (soundOn) soundClick();
}

/* ====== 데이터 ====== */
const SUBJECTS = [
  { id: 'math', name: '수학', icon: '🔢' },
  { id: 'science', name: '과학', icon: '🔬' },
  { id: 'calc', name: '연산', icon: '➕' },
  { id: 'social', name: '사회', icon: '🌏' }
];

const STORAGE_KEY = 'hw-app-v2';

let state = {
  tasks: {},
  coins: 0,
  pendingCoins: {},  // {dateKey: amount} - 미완료 일자별 예비 코인
  tickets: {},
  bonusGiven: {},
  momConfirmed: {},
  momPassword: '0000'
};

let viewYear, viewMonth, selectedDate;
let dogTimer = null;

function dateKey(y, m, d) {
  return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

function todayKey() {
  const t = new Date();
  return dateKey(t.getFullYear(), t.getMonth(), t.getDate());
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state = Object.assign(state, JSON.parse(raw));
  } catch (e) {}
  
  if (!state.tasks) state.tasks = {};
  if (!state.tickets) state.tickets = {};
  if (!state.bonusGiven) state.bonusGiven = {};
  if (!state.momConfirmed) state.momConfirmed = {};
  if (!state.pendingCoins) state.pendingCoins = {};
  if (!state.momPassword) state.momPassword = '0000';
  if (typeof state.coins !== 'number') state.coins = 0;
  
  const savedSound = localStorage.getItem('soundOn');
  if (savedSound !== null) {
    soundOn = savedSound === 'true';
    document.getElementById('soundToggle').textContent = soundOn ? '🔊' : '🔇';
  }
  
  const t = new Date();
  viewYear = t.getFullYear();
  viewMonth = t.getMonth();
  selectedDate = todayKey();
  
  ensureDay(selectedDate);
  renderAll();
}

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}

function ensureDay(key) {
  if (!state.tasks[key]) state.tasks[key] = {};
  SUBJECTS.forEach(s => {
    if (!state.tasks[key][s.id]) state.tasks[key][s.id] = [];
    if (state.tasks[key][s.id].length === 0) {
      state.tasks[key][s.id].push({ text: '숙제 내용 입력...', done: false });
    }
  });
}

function getDayStats(key) {
  const day = state.tasks[key];
  if (!day) return { done: 0, total: 0 };
  let done = 0, total = 0;
  SUBJECTS.forEach(s => {
    const list = day[s.id] || [];
    total += list.length;
    done += list.filter(t => t.done).length;
  });
  return { done, total };
}

function renderAll() {
  renderCalendar();
  renderTasks();
  renderMomSection();
  renderCoins();
}

function renderCoins() {
  document.getElementById('coinAmount').textContent = state.coins;
  document.getElementById('modalCoin').textContent = state.coins;
  
  // 예비 코인 총합 계산
  let pendingTotal = 0;
  Object.keys(state.pendingCoins).forEach(k => {
    if (!state.momConfirmed[k]) {
      pendingTotal += state.pendingCoins[k] || 0;
    }
  });
  
  const label = document.getElementById('pendingLabel');
  if (pendingTotal > 0) {
    label.textContent = ` (예비 ${pendingTotal})`;
  } else {
    label.textContent = '';
  }
}

function renderCalendar() {
  const monthNames = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  document.getElementById('calTitle').textContent = `${viewYear}년 ${monthNames[viewMonth]}`;
  
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  
  const dayNames = ['일','월','화','수','목','금','토'];
  dayNames.forEach((n, i) => {
    const el = document.createElement('div');
    el.className = 'cal-day-name';
    if (i === 0) el.classList.add('sun');
    if (i === 6) el.classList.add('sat');
    el.textContent = n;
    grid.appendChild(el);
  });
  
  const firstDay = new Date(viewYear, viewMonth, 1).getDay();
  const lastDate = new Date(viewYear, viewMonth + 1, 0).getDate();
  const today = todayKey();
  
  for (let i = 0; i < firstDay; i++) {
    const el = document.createElement('div');
    el.className = 'cal-cell empty';
    grid.appendChild(el);
  }
  
  for (let d = 1; d <= lastDate; d++) {
    const key = dateKey(viewYear, viewMonth, d);
    const cell = document.createElement('div');
    cell.className = 'cal-cell';
    
    const dow = new Date(viewYear, viewMonth, d).getDay();
    if (dow === 0) cell.classList.add('sun');
    if (dow === 6) cell.classList.add('sat');
    
    if (key === today) cell.classList.add('today');
    if (key === selectedDate) cell.classList.add('selected');
    
    const stats = getDayStats(key);
    let hasReal = false;
    if (stats.total > 0 && state.tasks[key]) {
      hasReal = SUBJECTS.some(s => 
        (state.tasks[key][s.id] || []).some(t => t.text !== '숙제 내용 입력...' || t.done)
      );
    }
    
    let html = `<span class="day-num">${d}</span>`;
    
    if (hasReal) {
      const allDone = stats.done === stats.total;
      const momOk = state.momConfirmed[key];
      
      if (allDone && momOk) {
        // 다 완료 + 엄마 확인 → 녹색 + 🐶
        cell.classList.add('all-confirmed');
      } else {
        // 물 차오르는 게이지 (25/50/75/100 단계)
        let level;
        if (allDone && !momOk) {
          level = 100;
        } else {
          const pct = stats.done / stats.total;
          if (pct >= 0.75) level = 75;
          else if (pct >= 0.5) level = 50;
          else if (pct >= 0.25) level = 25;
          else if (stats.done > 0) level = 25;
          else level = 0;
        }
        
        if (level > 0) {
          html += `<div class="cell-gauge h${level}"></div>`;
          cell.classList.add('gauge-lines');
        }
      }
    }
    
    cell.innerHTML = html;
    cell.onclick = () => { soundClick(); selectDate(key); };
    grid.appendChild(cell);
  }
}

function selectDate(key) {
  selectedDate = key;
  ensureDay(key);
  renderAll();
}

function changeMonth(delta) {
  soundClick();
  viewMonth += delta;
  if (viewMonth < 0) { viewMonth = 11; viewYear--; }
  if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  renderCalendar();
}

function renderTasks() {
  const [y, m, d] = selectedDate.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  const days = ['일','월','화','수','목','금','토'];
  document.getElementById('selectedDate').textContent = 
    `📅 ${m}월 ${d}일 (${days[dt.getDay()]})`;
  
  const container = document.getElementById('subjects');
  container.innerHTML = '';
  
  SUBJECTS.forEach(s => {
    const tasks = state.tasks[selectedDate][s.id];
    const done = tasks.filter(t => t.done).length;
    
    const sEl = document.createElement('div');
    sEl.className = 'subject';
    sEl.innerHTML = `
      <div class="subject-header">
        <span class="subject-icon">${s.icon}</span>
        <span class="subject-name">${s.name}</span>
        <span class="subject-status">${done}/${tasks.length}</span>
      </div>
      <div class="task-list" id="list-${s.id}"></div>
      <button class="add-btn" onclick="addTask('${s.id}')">+ 숙제 추가</button>
    `;
    container.appendChild(sEl);
    
    const list = sEl.querySelector(`#list-${s.id}`);
    tasks.forEach((task, idx) => {
      const tEl = document.createElement('div');
      tEl.className = 'task' + (task.done ? ' done' : '');
      tEl.innerHTML = `
        <div class="checkbox" onclick="toggleTask('${s.id}',${idx}, this)"></div>
        <input type="text" class="task-input" value="${esc(task.text)}" 
               onchange="updateText('${s.id}',${idx},this.value)"
               onfocus="this.select()">
        <button class="delete-btn" onclick="deleteTask('${s.id}',${idx})">✕</button>
      `;
      list.appendChild(tEl);
    });
  });
}

function renderMomSection() {
  const container = document.getElementById('momSection');
  const stats = getDayStats(selectedDate);
  const hasReal = SUBJECTS.some(s => 
    (state.tasks[selectedDate][s.id] || []).some(t => t.text !== '숙제 내용 입력...' || t.done)
  );
  const allDone = hasReal && stats.done === stats.total;
  const confirmed = state.momConfirmed[selectedDate];
  
  if (confirmed) {
    container.innerHTML = `
      <div class="mom-card confirmed">
        <div class="mom-confirmed-text">
          참 잘했어요 아들 <span class="heart">💕</span><br>
          <span style="font-size:18px;">엄마가 확인했어요 👩</span>
        </div>
      </div>
    `;
  } else {
    container.innerHTML = `
      <div class="mom-card">
        <div class="mom-title">👩 엄마 확인</div>
        <button class="mom-btn" id="momBtn" onclick="openMomPwd()" ${allDone ? '' : 'disabled'}>
          ${allDone ? '엄마 확인 받기' : '숙제 먼저 완료하기'}
        </button>
      </div>
    `;
  }
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function toggleTask(subjectId, idx, checkboxEl) {
  const task = state.tasks[selectedDate][subjectId][idx];
  const wasDone = task.done;
  task.done = !task.done;
  
  if (!wasDone && task.done) {
    soundCheck();
    setTimeout(() => soundCoin(), 200);
    // 예비 코인으로 적립
    addPendingCoin(selectedDate, 1, checkboxEl);
    showDogMsg('잘했어! +1 🪙 (예비)', 2200);
    
    setTimeout(() => {
      const stats = getDayStats(selectedDate);
      if (stats.done === stats.total && stats.total > 0 && !state.bonusGiven[selectedDate]) {
        state.bonusGiven[selectedDate] = true;
        soundBonus();
        addPendingCoin(selectedDate, 5, null);
        showDogMsg('🎉 하루 끝! 보너스 +5 🪙<br>엄마 확인 받자!', 2500);
        save();
        renderMomSection();
        renderCoins();
      }
    }, 700);
  } else if (wasDone && !task.done) {
    soundClick();
    let takeBack = 1;
    let msg = '아쉽다... -1 🪙';
    
    if (state.bonusGiven[selectedDate]) {
      takeBack += 5;
      delete state.bonusGiven[selectedDate];
      msg = '보너스도 회수! -6 🪙';
    }
    // 엄마 확인도 취소 → 코인을 다시 예비로
    if (state.momConfirmed[selectedDate]) {
      delete state.momConfirmed[selectedDate];
      // 합산됐던 코인을 다시 예비로 되돌리기
      const prevPending = state.pendingCoins[selectedDate] || 0;
      state.coins -= prevPending;
      if (state.coins < 0) state.coins = 0;
      state.pendingCoins[selectedDate] = prevPending; // 예비로 복귀
      msg = '엄마 확인 취소됨. 코인 회수!';
    }
    
    // 예비에서 차감
    const cur = state.pendingCoins[selectedDate] || 0;
    state.pendingCoins[selectedDate] = Math.max(0, cur - takeBack);
    
    showDogMsg(msg, 1800);
  }
  
  save();
  renderAll();
}

function addPendingCoin(dateKey, amount, fromEl) {
  state.pendingCoins[dateKey] = (state.pendingCoins[dateKey] || 0) + amount;
  
  if (fromEl) {
    const rect = fromEl.getBoundingClientRect();
    const coinDisplay = document.querySelector('.coin-display').getBoundingClientRect();
    
    for (let i = 0; i < Math.min(amount, 3); i++) {
      setTimeout(() => {
        const coin = document.createElement('div');
        coin.className = 'flying-coin';
        coin.textContent = '🪙';
        coin.style.left = rect.left + 'px';
        coin.style.top = rect.top + 'px';
        document.body.appendChild(coin);
        
        requestAnimationFrame(() => {
          coin.style.left = coinDisplay.left + 'px';
          coin.style.top = coinDisplay.top + 'px';
          coin.style.transform = 'scale(0.5) rotate(720deg)';
          coin.style.opacity = '0';
        });
        
        setTimeout(() => coin.remove(), 900);
      }, i * 100);
    }
  }
  renderCoins();
}

function showDogMsg(msg, duration = 2200) {
  if (dogTimer) {
    clearTimeout(dogTimer);
    dogTimer = null;
  }
  const dogReward = document.getElementById('dogReward');
  document.getElementById('dogMsg').innerHTML = msg;
  dogReward.classList.add('show');
  dogTimer = setTimeout(() => {
    dogReward.classList.remove('show');
    dogTimer = null;
  }, duration);
}

function hideDogMsg() {
  const dogReward = document.getElementById('dogReward');
  dogReward.classList.remove('show');
  if (dogTimer) { clearTimeout(dogTimer); dogTimer = null; }
}

function giveCoin(fromEl, amount, msg) {
  state.coins += amount;
  showDogMsg(msg, 2200);
  
  if (fromEl) {
    const rect = fromEl.getBoundingClientRect();
    const coinDisplay = document.querySelector('.coin-display').getBoundingClientRect();
    
    for (let i = 0; i < Math.min(amount, 3); i++) {
      setTimeout(() => {
        const coin = document.createElement('div');
        coin.className = 'flying-coin';
        coin.textContent = '🪙';
        coin.style.left = rect.left + 'px';
        coin.style.top = rect.top + 'px';
        document.body.appendChild(coin);
        
        requestAnimationFrame(() => {
          coin.style.left = coinDisplay.left + 'px';
          coin.style.top = coinDisplay.top + 'px';
          coin.style.transform = 'scale(0.5) rotate(720deg)';
          coin.style.opacity = '0';
        });
        
        setTimeout(() => coin.remove(), 900);
      }, i * 100);
    }
  }
  renderCoins();
}

function updateText(subjectId, idx, text) {
  state.tasks[selectedDate][subjectId][idx].text = text;
  save();
}

function addTask(subjectId) {
  soundClick();
  state.tasks[selectedDate][subjectId].push({ text: '새 숙제', done: false });
  delete state.bonusGiven[selectedDate];
  delete state.momConfirmed[selectedDate];
  save();
  renderAll();
  setTimeout(() => {
    const list = document.getElementById(`list-${subjectId}`);
    const inputs = list.querySelectorAll('.task-input');
    const last = inputs[inputs.length - 1];
    if (last) { last.focus(); last.select(); }
  }, 50);
}

function deleteTask(subjectId, idx) {
  soundClick();
  state.tasks[selectedDate][subjectId].splice(idx, 1);
  if (state.tasks[selectedDate][subjectId].length === 0) {
    state.tasks[selectedDate][subjectId].push({ text: '숙제 내용 입력...', done: false });
  }
  save();
  renderAll();
}

/* ====== 엄마 확인 ====== */
function openMomPwd() {
  soundClick();
  document.getElementById('momPwdInput').value = '';
  document.getElementById('momPwdError').textContent = '';
  document.getElementById('momPwdModal').classList.add('show');
  setTimeout(() => document.getElementById('momPwdInput').focus(), 100);
}

function closeMomPwd() {
  document.getElementById('momPwdModal').classList.remove('show');
}

function checkMomPwd() {
  const input = document.getElementById('momPwdInput').value;
  const err = document.getElementById('momPwdError');
  
  if (input === state.momPassword) {
    state.momConfirmed[selectedDate] = true;
    // 예비 코인을 진짜 코인으로 합산
    const pending = state.pendingCoins[selectedDate] || 0;
    state.coins += pending;
    // 예비는 유지 (취소 시 되돌리기 위해)
    save();
    soundFanfare();
    closeMomPwd();
    if (pending > 0) {
      showDogMsg(`참 잘했어요 아들 💕<br>예비 코인 +${pending} 합산!`, 2800);
    } else {
      showDogMsg('참 잘했어요 아들 💕', 2500);
    }
    renderAll();
  } else {
    err.textContent = '비밀번호가 틀려요 ❌';
    soundError();
    document.getElementById('momPwdInput').value = '';
  }
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('momPwdInput').addEventListener('keypress', e => {
    if (e.key === 'Enter') checkMomPwd();
  });
});

/* ====== 설정 ====== */
function openSettings() {
  soundClick();
  document.getElementById('curPwdInput').value = '';
  document.getElementById('newPwdInput').value = '';
  document.getElementById('settingsError').textContent = '';
  document.getElementById('settingsModal').classList.add('show');
}

function closeSettings() {
  document.getElementById('settingsModal').classList.remove('show');
}

function changePwd() {
  const cur = document.getElementById('curPwdInput').value;
  const newP = document.getElementById('newPwdInput').value;
  const err = document.getElementById('settingsError');
  
  if (cur !== state.momPassword) {
    err.textContent = '현재 비밀번호가 틀려요 ❌';
    soundError();
    return;
  }
  if (!/^\d{4}$/.test(newP)) {
    err.textContent = '새 비밀번호는 4자리 숫자여야 해요';
    soundError();
    return;
  }
  
  state.momPassword = newP;
  save();
  soundFanfare();
  closeSettings();
  showToast('🔐 비밀번호가 변경됐어요!');
}

/* ====== 비밀번호 초기화 ====== */
const MASTER_CODE = '1225';

function openResetPwd() {
  soundClick();
  closeSettings();
  document.getElementById('masterCodeInput').value = '';
  document.getElementById('resetPwdError').textContent = '';
  document.getElementById('resetPwdModal').classList.add('show');
  setTimeout(() => document.getElementById('masterCodeInput').focus(), 100);
}

function closeResetPwd() {
  document.getElementById('resetPwdModal').classList.remove('show');
}

function resetPwd() {
  const input = document.getElementById('masterCodeInput').value;
  const err = document.getElementById('resetPwdError');
  
  if (input === MASTER_CODE) {
    state.momPassword = '0000';
    save();
    soundFanfare();
    closeResetPwd();
    showToast('🔐 비밀번호가 0000으로 초기화됐어요!');
  } else {
    err.textContent = '마스터 코드가 틀려요 ❌';
    soundError();
    document.getElementById('masterCodeInput').value = '';
  }
}

/* ====== 상점 ====== */
function openShop() {
  soundClick();
  renderOwned();
  updateBuyButtons();
  document.getElementById('shopModal').classList.add('show');
}

function closeShop() {
  soundClick();
  document.getElementById('shopModal').classList.remove('show');
}

function renderOwned() {
  const ownedEl = document.getElementById('ownedList');
  const items = [];
  if (state.tickets.samgyup > 0) items.push(`🥓 삼겹살 ${state.tickets.samgyup}장`);
  if (state.tickets.pcbang > 0) items.push(`🎮 PC방 ${state.tickets.pcbang}장`);
  
  if (items.length === 0) {
    ownedEl.innerHTML = '<span class="owned-empty">아직 없어요. 코인 모으자!</span>';
  } else {
    ownedEl.textContent = items.join(' · ');
  }
}

function updateBuyButtons() {
  document.getElementById('buy-samgyup').disabled = state.coins < 30;
  document.getElementById('buy-pcbang').disabled = state.coins < 20;
}

function buyItem(id, price, name) {
  if (state.coins < price) return;
  state.coins -= price;
  state.tickets[id] = (state.tickets[id] || 0) + 1;
  save();
  soundFanfare();
  renderCoins();
  renderOwned();
  updateBuyButtons();
  showToast(`🎉 ${name} 구매 완료!`);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
