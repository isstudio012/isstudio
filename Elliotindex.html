<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#EFF6FF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="숙제">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>숙제 체크리스트</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  body {
    font-family: 'Gowun Dodum', sans-serif;
    background: #0F172A;
    min-height: 100vh;
    padding: 20px 14px 40px;
    padding-top: max(20px, env(safe-area-inset-top));
    padding-bottom: max(40px, env(safe-area-inset-bottom));
    color: #FFFFFF;
    width: 100%;
    max-width: 100vw;
    overflow-x: hidden;
  }
  
  .container { max-width: 480px; margin: 0 auto; width: 100%; }
  
  .header { 
    text-align: left; 
    margin-bottom: 16px;
    padding-right: 36px;
    min-height: 40px;
    display: flex;
    align-items: center;
    overflow: visible;
  }
  
  .header h1 {
    font-family: 'Gaegu', cursive;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -1.5px;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 8px;
    transition: background 0.2s;
    color: #FFFFFF;
    white-space: nowrap;
    overflow: visible;
    flex-shrink: 0;
  }
  
  .header h1:hover { background: rgba(255,255,255,0.1); }
  
  .header-title-input {
    font-family: 'Gaegu', cursive;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -1.5px;
    border: 2px solid #2563EB;
    border-radius: 8px;
    padding: 4px 6px;
    background: white;
    outline: none;
    min-width: 100px;
    max-width: 100%;
    color: #1E3A8A;
  }
  
  .top-buttons {
    position: fixed;
    top: 14px;
    right: 8px;
    display: flex;
    flex-direction: column;
    gap: 0;
    z-index: 100;
    background: white;
    border: 1.5px solid #1E3A8A;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 1.5px 1.5px 0 #1E3A8A;
  }
  
  .top-buttons button {
    background: white;
    border: none;
    width: 22px;
    height: 22px;
    font-size: 9px;
    cursor: pointer;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #1E293B;
    font-family: 'Gaegu', cursive;
    font-weight: 700;
  }
  
  .top-buttons button + button {
    border-left: none;
    border-top: 1.5px solid #1E3A8A;
  }
  
  .top-buttons button:active {
    background: #DBEAFE;
  }
  
  .top-bar { display: flex; gap: 10px; margin-bottom: 18px; }
  
  .coin-display {
    flex: 1;
    background: linear-gradient(135deg, #60A5FA, #3B82F6);
    border: 3px solid #1E3A8A;
    border-radius: 16px;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: 4px 4px 0 #1E3A8A;
  }
  
  .coin-icon { font-size: 28px; animation: spin 4s linear infinite; }
  
  @keyframes spin {
    0%, 90%, 100% { transform: rotateY(0deg); }
    95% { transform: rotateY(360deg); }
  }
  
  .coin-amount { font-family: 'Gaegu', cursive; font-size: 26px; font-weight: 700; color: white; }
  .coin-label { font-family: 'Gaegu', cursive; font-size: 14px; color: #DBEAFE; margin-top: -4px; }
  
  .shop-btn {
    background: #1E3A8A;
    border: 3px solid #1E3A8A;
    border-radius: 16px;
    padding: 10px 16px;
    font-family: 'Gaegu', cursive;
    font-size: 18px;
    color: white;
    cursor: pointer;
    box-shadow: 4px 4px 0 #1E3A8A;
  }
  
  .shop-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #1E3A8A; }
  
  .calendar-card {
    background: white;
    border: 3px solid #1E3A8A;
    border-radius: 16px;
    padding: 12px;
    margin-bottom: 20px;
    box-shadow: 4px 4px 0 #1E3A8A;
    overflow: hidden;
  }
  
  .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  
  .cal-nav {
    background: #BFDBFE;
    border: 2px solid #1E3A8A;
    border-radius: 10px;
    width: 36px;
    height: 36px;
    font-family: 'Gaegu', cursive;
    font-size: 20px;
    cursor: pointer;
    font-weight: 700;
  }
  
  .cal-title { font-family: 'Gaegu', cursive; font-size: 24px; font-weight: 700; }
  
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; width: 100%; }
  
  .cal-day-name {
    text-align: center;
    font-family: 'Gaegu', cursive;
    font-size: 14px;
    font-weight: 700;
    color: #475569;
    padding: 4px 0;
  }
  
  .cal-day-name.sun { color: #DC2626; }
  .cal-day-name.sat { color: #1D4ED8; }
  
  .cal-cell {
    aspect-ratio: 1;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-family: 'Gaegu', cursive;
    font-size: 16px;
    font-weight: 700;
    background: #DBEAFE;
    border: 2px solid transparent;
    position: relative;
    transition: all 0.15s;
    padding-top: 4px;
    padding-bottom: 8px;
    min-width: 0;
    box-sizing: border-box;
    overflow: hidden;
  }
  
  .cal-cell:active { transform: scale(0.95); }
  .cal-cell.empty { background: transparent; cursor: default; }
  
  .cal-cell.today { border-color: #2563EB; background: #60A5FA; }
  .cal-cell.selected { background: #1E3A8A; color: #EFF6FF; border-color: #1E3A8A; }
  
  .cell-gauge {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    background: #3B82F6;
    border-radius: 0 0 8px 8px;
    transition: height 0.4s ease;
    pointer-events: none;
  }
  
  .cell-gauge.h25 { height: 25%; }
  .cell-gauge.h50 { height: 50%; }
  .cell-gauge.h75 { height: 75%; }
  .cell-gauge.h100 { height: 100%; border-radius: 8px; }
  
  .cal-cell.gauge-lines::before {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    bottom: 0;
    pointer-events: none;
    background-image: 
      linear-gradient(to bottom, transparent calc(25% - 2px), rgba(255,255,255,0.9) 25%, transparent calc(25% + 2px)),
      linear-gradient(to bottom, transparent calc(50% - 2px), rgba(255,255,255,0.9) 50%, transparent calc(50% + 2px)),
      linear-gradient(to bottom, transparent calc(75% - 2px), rgba(255,255,255,0.9) 75%, transparent calc(75% + 2px));
    z-index: 1;
    border-radius: 8px;
  }
  
  .cal-cell .day-num { position: relative; z-index: 2; }
  
  .cal-cell.all-confirmed { background: #7DD3FC; }
  .cal-cell.all-confirmed::after {
    content: '🐶';
    position: absolute;
    bottom: 2px;
    font-size: 14px;
    line-height: 1;
  }
  .cal-cell.all-confirmed .cell-gauge { display: none; }
  
  .cal-cell.selected.all-confirmed { background: #1E3A8A; }
  
  .cal-cell.sun { color: #DC2626; }
  .cal-cell.sat { color: #1D4ED8; }
  .cal-cell.selected.sun, .cal-cell.selected.sat { color: #EFF6FF; }
  
  .selected-date {
    text-align: center;
    margin-bottom: 14px;
    font-family: 'Gaegu', cursive;
    font-size: 22px;
    font-weight: 700;
    color: #FFFFFF;
  }
  
  .subject {
    background: white;
    border: 2px solid #1E3A8A;
    border-radius: 12px;
    margin-bottom: 8px;
    overflow: hidden;
    box-shadow: 3px 3px 0 #1E3A8A;
  }
  
  .subject-header {
    padding: 5px 10px;
    display: flex;
    align-items: center;
    gap: 6px;
    border-bottom: 1px dashed #CBD5E1;
  }
  
  .subject-name-input {
    flex: 1;
    font-family: 'Gaegu', cursive;
    font-size: 17px;
    font-weight: 700;
    border: none;
    background: transparent;
    outline: none;
    padding: 2px 4px;
    border-radius: 6px;
    color: #1E3A8A;
    min-width: 0;
  }
  
  .subject-name-input:focus { background: rgba(255,255,255,0.7); }
  
  .subject-status { font-size: 12px; color: #1E40AF; font-weight: 700; }
  
  .subject-delete-btn {
    background: transparent;
    border: none;
    color: #1E3A8A;
    font-size: 22px;
    cursor: pointer;
    padding: 2px 8px;
    opacity: 0.7;
    font-weight: 700;
    line-height: 1;
  }
  
  .subject-delete-btn:active { opacity: 1; }
  
  .task-list { padding: 2px 0; }
  
  .task {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 10px;
    cursor: pointer;
    user-select: none;
  }
  
  .task:active { background: rgba(255,244,214,0.5); }
  
  .checkbox {
    width: 20px;
    height: 20px;
    border: 2px solid #1E3A8A;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    background: white;
    transition: all 0.2s;
  }
  
  .task.done .checkbox { background: #0EA5E9; }
  .task.done .checkbox::after { content: '✓'; color: white; font-weight: bold; font-size: 13px; }
  
  .task-input {
    flex: 1;
    border: none;
    background: transparent;
    font-family: 'Gowun Dodum', sans-serif;
    font-size: 14px;
    color: #1E3A8A;
    outline: none;
    padding: 2px 0;
    min-width: 0;
  }
  
  .task.done .task-input { text-decoration: line-through; color: #94A3B8; }
  
  .delete-btn {
    background: transparent;
    border: none;
    color: #1E3A8A;
    font-size: 22px;
    cursor: pointer;
    padding: 2px 8px;
    font-weight: 700;
    flex-shrink: 0;
    line-height: 1;
    opacity: 0.7;
  }
  
  .delete-btn:active { opacity: 1; }
  
  .add-btn {
    width: 100%;
    padding: 5px;
    background: rgba(255,244,214,0.6);
    border: none;
    border-top: 1px dashed #CBD5E1;
    font-family: 'Gaegu', cursive;
    font-size: 13px;
    color: #475569;
    cursor: pointer;
  }
  
  .add-btn:active { background: #BFDBFE; color: #1E3A8A; }
  
  /* 과목 추가 버튼 */
  .add-subject-btn {
    width: 100%;
    padding: 12px;
    background: white;
    border: 2px dashed #475569;
    border-radius: 12px;
    font-family: 'Gaegu', cursive;
    font-size: 17px;
    font-weight: 700;
    color: #475569;
    cursor: pointer;
    margin-bottom: 12px;
  }
  
  .add-subject-btn:active { background: #DBEAFE; }
  
  .empty-subjects {
    text-align: center;
    padding: 20px 16px;
    color: #475569;
    font-family: 'Gaegu', cursive;
    font-size: 16px;
    background: white;
    border: 2px dashed #475569;
    border-radius: 12px;
    margin-bottom: 12px;
  }
  
  .mom-card {
    background: white;
    border: 3px solid #1E3A8A;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: 4px 4px 0 #1E3A8A;
    text-align: center;
  }
  
  .mom-card.confirmed {
    background: linear-gradient(135deg, #BFDBFE, #7DD3FC);
  }
  
  .mom-title {
    font-family: 'Gaegu', cursive;
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 10px;
  }
  
  .mom-btn {
    background: #2563EB;
    color: white;
    border: 3px solid #1E3A8A;
    border-radius: 12px;
    padding: 10px 24px;
    font-family: 'Gaegu', cursive;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 3px 3px 0 #1E3A8A;
  }
  
  .mom-btn:disabled {
    background: #94A3B8;
    cursor: not-allowed;
  }
  
  .mom-confirmed-text {
    font-family: 'Gaegu', cursive;
    font-size: 22px;
    font-weight: 700;
    color: #1E3A8A;
    line-height: 1.4;
  }
  
  .mom-confirmed-text .heart {
    color: #EC4899;
    font-size: 26px;
  }
  
  .dog-reward {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: white;
    border: 4px solid #1E3A8A;
    border-radius: 20px;
    padding: 12px 18px;
    box-shadow: 6px 6px 0 #1E3A8A;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: opacity 0.3s;
    z-index: 200;
    max-width: 320px;
    opacity: 0;
    pointer-events: none;
    cursor: pointer;
  }
  
  .dog-reward.show {
    opacity: 1;
    pointer-events: auto;
  }
  
  .dog-face { font-size: 36px; animation: wiggle 0.5s ease infinite; }
  
  @keyframes wiggle {
    0%, 100% { transform: rotate(-8deg); }
    50% { transform: rotate(8deg); }
  }
  
  .dog-msg { font-family: 'Gaegu', cursive; font-size: 16px; font-weight: 700; line-height: 1.3; }
  
  .flying-coin {
    position: fixed;
    font-size: 32px;
    z-index: 199;
    pointer-events: none;
    transition: all 0.8s cubic-bezier(0.5, -0.5, 0.5, 1);
  }
  
  .modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 300;
    padding: 20px;
  }
  
  .modal-bg.show { display: flex; }
  
  .pwd-modal {
    background: white !important;
    border: 2px solid #1E3A8A !important;
    border-radius: 14px !important;
    padding: 18px !important;
    max-width: 300px !important;
    width: 100% !important;
    box-shadow: 4px 4px 0 #1E3A8A !important;
  }
  
  .pwd-modal-title {
    font-family: 'Gaegu', cursive;
    font-size: 18px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 6px;
    color: #1E293B;
  }
  
  .pwd-modal-sub {
    text-align: center;
    margin-bottom: 10px;
    font-family: 'Gaegu', cursive;
    font-size: 13px;
    color: #475569;
  }
  
  .modal {
    background: #EFF6FF;
    border: 4px solid #1E3A8A;
    border-radius: 20px;
    padding: 24px;
    max-width: 380px;
    width: 100%;
    box-shadow: 8px 8px 0 #1E3A8A;
    max-height: 85vh;
    overflow-y: auto;
  }
  
  .modal-title { font-family: 'Gaegu', cursive; font-size: 28px; font-weight: 700; text-align: center; margin-bottom: 8px; }
  .modal-sub { text-align: center; margin-bottom: 20px; font-family: 'Gaegu', cursive; font-size: 18px; color: #2563EB; }
  
  .shop-modal {
    max-width: 340px !important;
    padding: 18px !important;
  }
  
  .shop-modal-title {
    font-family: 'Gaegu', cursive;
    font-size: 22px;
    font-weight: 700;
    text-align: center;
    margin-bottom: 4px;
    color: #1E293B;
  }
  
  .shop-modal-sub {
    text-align: center;
    margin-bottom: 12px;
    font-family: 'Gaegu', cursive;
    font-size: 15px;
    color: #2563EB;
    font-weight: 700;
  }
  
  .shop-items-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 10px;
  }
  
  .shop-item {
    background: white;
    border: 2px solid #1E3A8A;
    border-radius: 10px;
    padding: 8px 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    box-shadow: 2px 2px 0 #1E3A8A;
  }
  
  .shop-item-icon { font-size: 22px; }
  .shop-item-name { 
    font-family: 'Gaegu', cursive; 
    font-size: 13px; 
    font-weight: 700;
    text-align: center;
    color: #1E293B;
    line-height: 1.1;
    word-break: keep-all;
  }
  .shop-item-price { 
    font-family: 'Gaegu', cursive; 
    font-size: 12px; 
    color: #2563EB;
    font-weight: 700;
  }
  
  .shop-item-actions {
    display: flex;
    gap: 4px;
    width: 100%;
    margin-top: 2px;
  }
  
  .buy-btn {
    flex: 1;
    background: #2563EB;
    border: 1.5px solid #1E3A8A;
    color: white;
    font-family: 'Gaegu', cursive;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 0;
    border-radius: 6px;
    cursor: pointer;
  }
  
  .buy-btn:disabled { background: #94A3B8; cursor: not-allowed; }
  
  .shop-item-delete {
    background: white;
    border: 1.5px solid #1E3A8A;
    color: #1E3A8A;
    font-family: 'Gaegu', cursive;
    font-size: 14px;
    font-weight: 700;
    padding: 0 8px;
    border-radius: 6px;
    cursor: pointer;
    line-height: 1;
  }
  
  .add-shop-item-btn {
    width: 100%;
    padding: 7px;
    background: white;
    border: 2px dashed #1E3A8A;
    border-radius: 8px;
    font-family: 'Gaegu', cursive;
    font-size: 13px;
    font-weight: 700;
    color: #1E3A8A;
    cursor: pointer;
    margin-bottom: 8px;
  }
  
  .modal-close {
    width: 100%;
    margin-top: 8px;
    padding: 10px;
    background: #1E3A8A;
    color: white;
    border: none;
    border-radius: 10px;
    font-family: 'Gaegu', cursive;
    font-size: 18px;
    cursor: pointer;
  }
  
  .owned-tickets {
    background: #DBEAFE;
    border: 1.5px dashed #1E3A8A;
    border-radius: 8px;
    padding: 6px 8px;
    margin-bottom: 10px;
  }
  
  .owned-title { font-family: 'Gaegu', cursive; font-size: 13px; font-weight: 700; margin-bottom: 3px; color: #1E40AF; }
  .owned-list { font-family: 'Gaegu', cursive; font-size: 12px; color: #1E293B; }
  .owned-empty { color: #94A3B8; font-style: italic; }
  
  .pwd-input {
    width: 100%;
    padding: 9px;
    border: 2px solid #1E3A8A;
    border-radius: 10px;
    font-family: 'Gaegu', cursive;
    font-size: 18px;
    text-align: center;
    margin-bottom: 8px;
    letter-spacing: 6px;
    outline: none;
    color: #1E293B;
  }
  
  .pwd-input:focus { border-color: #2563EB; }
  
  .text-input {
    width: 100%;
    padding: 9px;
    border: 2px solid #1E3A8A;
    border-radius: 10px;
    font-family: 'Gaegu', cursive;
    font-size: 16px;
    text-align: center;
    margin-bottom: 8px;
    outline: none;
    background: white;
    color: #1E293B;
  }
  
  .text-input:focus { border-color: #2563EB; }
  
  .modal-btns { display: flex; gap: 8px; margin-top: 4px; }
  
  .modal-btn {
    flex: 1;
    padding: 9px;
    border: 2px solid #1E3A8A;
    border-radius: 10px;
    font-family: 'Gaegu', cursive;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 2px 2px 0 #1E3A8A;
  }
  
  .modal-btn:active {
    transform: translate(1px, 1px);
    box-shadow: 1px 1px 0 #1E3A8A;
  }
  
  .modal-btn.primary { background: #2563EB; color: white; }
  .modal-btn.danger { background: #1E3A8A; color: white; }
  .modal-btn.cancel { background: white; color: #1E3A8A; }
  
  .pwd-error {
    color: #DC2626;
    text-align: center;
    font-family: 'Gaegu', cursive;
    font-size: 13px;
    margin-bottom: 6px;
    min-height: 18px;
  }
  
  .confirm-msg {
    text-align: center;
    font-family: 'Gaegu', cursive;
    font-size: 18px;
    margin-bottom: 16px;
    line-height: 1.4;
  }
  
  .toast {
    position: fixed;
    top: 80px;
    left: 50%;
    transform: translateX(-50%);
    background: #0EA5E9;
    color: white;
    padding: 12px 20px;
    border: 3px solid #1E3A8A;
    border-radius: 14px;
    font-family: 'Gaegu', cursive;
    font-size: 16px;
    font-weight: 700;
    box-shadow: 4px 4px 0 #1E3A8A;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    z-index: 400;
    max-width: 80%;
    text-align: center;
  }
  
  .toast.show { opacity: 1; }
  
  /* old sound-toggle replaced by top-buttons */
</style>
</head>
<body>

<div class="top-buttons">

<script>
/* ====== 사운드 ====== */
let audioCtx = null;
let soundOn = true;

function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}

function playTone(freq, duration, type = 'sine', volume = 0.15) {
  if (!soundOn) return;
  initAudio();
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(volume, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

function soundCheck() {
  playTone(1200, 0.15, 'sine', 0.2);
  setTimeout(() => playTone(1600, 0.2, 'sine', 0.15), 80);
}
function soundCoin() {
  playTone(800, 0.08, 'square', 0.1);
  setTimeout(() => playTone(1200, 0.1, 'square', 0.1), 60);
  setTimeout(() => playTone(1600, 0.15, 'square', 0.08), 120);
}
function soundFanfare() {
  [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => playTone(f, 0.2, 'triangle', 0.18), i * 100));
}
function soundBonus() {
  [523, 659, 784, 880, 1047].forEach((f, i) => setTimeout(() => playTone(f, 0.15, 'sine', 0.15), i * 80));
}
function soundClick() { playTone(600, 0.05, 'sine', 0.08); }
function soundError() { playTone(300, 0.2, 'sawtooth', 0.1); }

function toggleSound() {
  soundOn = !soundOn;
  document.getElementById('soundToggle').textContent = soundOn ? '소리' : '무음';
  localStorage.setItem('soundOn', soundOn);
  if (soundOn) soundClick();
}

/* ====== 데이터 ====== */
const STORAGE_KEY = 'hw-app-v2';

let state = {
  appTitle: '숙제 체크리스트',
  subjects: [],
  tasks: {},
  coins: 0,
  pendingCoins: {},
  tickets: {},
  shopItems: [
    { id: 'samgyup', name: '삼겹살', icon: '🥓', price: 30 },
    { id: 'pcbang', name: 'PC방', icon: '🎮', price: 20 }
  ],
  bonusGiven: {},
  momConfirmed: {},
  momPassword: '0000'
};

let viewYear, viewMonth, selectedDate;
let dogTimer = null;
let pendingDeleteSubjectId = null;

function dateKey(y, m, d) {
  return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

function todayKey() {
  const t = new Date();
  return dateKey(t.getFullYear(), t.getMonth(), t.getDate());
}

const SUBJECT_COLORS = [
  '#FFE8E8', // 연분홍
  '#E8F4FF', // 연하늘
  '#DBEAFE', // 연노랑
  '#E8FFE8', // 연초록
  '#F4E8FF', // 연보라
  '#FFE8D6', // 연주황
  '#D6F4FF', // 연파랑
  '#FFEFE8', // 연살구
  '#E8FFF4', // 연민트
  '#FFF8E8'  // 연크림
];

function randomSubjectColor() {
  return SUBJECT_COLORS[Math.floor(Math.random() * SUBJECT_COLORS.length)];
}

function genId() {
  return 's_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state = Object.assign(state, JSON.parse(raw));
  } catch (e) {}
  
  if (!state.subjects) state.subjects = [];
  if (!state.shopItems || !Array.isArray(state.shopItems) || state.shopItems.length === 0) {
    state.shopItems = [
      { id: 'samgyup', name: '삼겹살', icon: '🥓', price: 30 },
      { id: 'pcbang', name: 'PC방', icon: '🎮', price: 20 }
    ];
  }
  // 기존 과목에 색이 없으면 부여
  state.subjects.forEach(s => {
    if (!s.color) s.color = randomSubjectColor();
  });
  if (!state.tasks) state.tasks = {};
  if (!state.tickets) state.tickets = {};
  if (!state.bonusGiven) state.bonusGiven = {};
  if (!state.momConfirmed) state.momConfirmed = {};
  if (!state.pendingCoins) state.pendingCoins = {};
  if (!state.momPassword) state.momPassword = '0000';
  if (!state.appTitle) state.appTitle = '숙제 체크리스트';
  if (typeof state.coins !== 'number') state.coins = 0;
  
  const savedSound = localStorage.getItem('soundOn');
  if (savedSound !== null) {
    soundOn = savedSound === 'true';
    document.getElementById('soundToggle').textContent = soundOn ? '소리' : '무음';
  }
  
  document.getElementById('appTitle').textContent = state.appTitle;
  
  const t = new Date();
  viewYear = t.getFullYear();
  viewMonth = t.getMonth();
  selectedDate = todayKey();
  
  ensureDay(selectedDate);
  renderAll();
}

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}

function ensureDay(key) {
  if (!state.tasks[key]) state.tasks[key] = {};
  state.subjects.forEach(s => {
    if (!state.tasks[key][s.id]) state.tasks[key][s.id] = [];
    if (state.tasks[key][s.id].length === 0) {
      state.tasks[key][s.id].push({ text: '숙제 내용 입력...', done: false });
    }
  });
}

function getDayStats(key) {
  const day = state.tasks[key];
  if (!day) return { done: 0, total: 0 };
  let done = 0, total = 0;
  state.subjects.forEach(s => {
    const list = day[s.id] || [];
    total += list.length;
    done += list.filter(t => t.done).length;
  });
  return { done, total };
}

function hasRealTaskOnDay(key) {
  if (!state.tasks[key]) return false;
  return state.subjects.some(s => 
    (state.tasks[key][s.id] || []).some(t => t.text !== '숙제 내용 입력...' || t.done)
  );
}

function renderAll() {
  renderCalendar();
  renderTasks();
  renderMomSection();
  renderCoins();
}

function renderCoins() {
  document.getElementById('coinAmount').textContent = state.coins;
  document.getElementById('modalCoin').textContent = state.coins;
  
  let pendingTotal = 0;
  Object.keys(state.pendingCoins).forEach(k => {
    if (!state.momConfirmed[k]) {
      pendingTotal += state.pendingCoins[k] || 0;
    }
  });
  
  const label = document.getElementById('pendingLabel');
  if (pendingTotal > 0) {
    label.textContent = ` (예비 ${pendingTotal})`;
  } else {
    label.textContent = '';
  }
}

function renderCalendar() {
  const monthNames = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  document.getElementById('calTitle').textContent = `${viewYear}년 ${monthNames[viewMonth]}`;
  
  const grid = document.getElementById('calGrid');
  grid.innerHTML = '';
  
  const dayNames = ['일','월','화','수','목','금','토'];
  dayNames.forEach((n, i) => {
    const el = document.createElement('div');
    el.className = 'cal-day-name';
    if (i === 0) el.classList.add('sun');
    if (i === 6) el.classList.add('sat');
    el.textContent = n;
    grid.appendChild(el);
  });
  
  const firstDay = new Date(viewYear, viewMonth, 1).getDay();
  const lastDate = new Date(viewYear, viewMonth + 1, 0).getDate();
  const today = todayKey();
  
  for (let i = 0; i < firstDay; i++) {
    const el = document.createElement('div');
    el.className = 'cal-cell empty';
    grid.appendChild(el);
  }
  
  for (let d = 1; d <= lastDate; d++) {
    const key = dateKey(viewYear, viewMonth, d);
    const cell = document.createElement('div');
    cell.className = 'cal-cell';
    
    const dow = new Date(viewYear, viewMonth, d).getDay();
    if (dow === 0) cell.classList.add('sun');
    if (dow === 6) cell.classList.add('sat');
    
    if (key === today) cell.classList.add('today');
    if (key === selectedDate) cell.classList.add('selected');
    
    const stats = getDayStats(key);
    const hasReal = hasRealTaskOnDay(key);
    
    let html = `<span class="day-num">${d}</span>`;
    
    if (hasReal && stats.total > 0) {
      const allDone = stats.done === stats.total;
      const momOk = state.momConfirmed[key];
      
      if (allDone && momOk) {
        cell.classList.add('all-confirmed');
      } else {
        let level;
        if (allDone && !momOk) {
          level = 100;
        } else {
          const pct = stats.done / stats.total;
          if (pct >= 0.75) level = 75;
          else if (pct >= 0.5) level = 50;
          else if (pct >= 0.25) level = 25;
          else if (stats.done > 0) level = 25;
          else level = 0;
        }
        
        if (level > 0) {
          html += `<div class="cell-gauge h${level}"></div>`;
          cell.classList.add('gauge-lines');
        }
      }
    }
    
    cell.innerHTML = html;
    cell.onclick = () => { soundClick(); selectDate(key); };
    grid.appendChild(cell);
  }
}

function selectDate(key) {
  selectedDate = key;
  ensureDay(key);
  renderAll();
}

function changeMonth(delta) {
  soundClick();
  viewMonth += delta;
  if (viewMonth < 0) { viewMonth = 11; viewYear--; }
  if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  renderCalendar();
}

function renderTasks() {
  const [y, m, d] = selectedDate.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  const days = ['일','월','화','수','목','금','토'];
  document.getElementById('selectedDate').textContent = 
    `📅 ${m}월 ${d}일 (${days[dt.getDay()]})`;
  
  const container = document.getElementById('subjects');
  container.innerHTML = '';
  
  if (state.subjects.length === 0) {
    container.innerHTML = '<div class="empty-subjects">아직 과목이 없어요.<br>아래 "+ 과목 추가" 버튼을 눌러주세요!</div>';
    return;
  }
  
  state.subjects.forEach(s => {
    const tasks = state.tasks[selectedDate][s.id] || [];
    const done = tasks.filter(t => t.done).length;
    
    const sEl = document.createElement('div');
    sEl.className = 'subject';
    sEl.innerHTML = `
      <div class="subject-header" style="background:${s.color || '#DBEAFE'};">
        <input type="text" class="subject-name-input" value="${esc(s.name)}" 
               maxlength="20"
               onchange="updateSubjectName('${s.id}', this.value)"
               onfocus="this.select()">
        <span class="subject-status">${done}/${tasks.length}</span>
        <button class="subject-delete-btn" onclick="openDeleteSubject('${s.id}')" title="과목 삭제">−</button>
      </div>
      <div class="task-list" id="list-${s.id}"></div>
      <button class="add-btn" onclick="addTask('${s.id}')">+ 숙제 추가</button>
    `;
    container.appendChild(sEl);
    
    const list = sEl.querySelector(`#list-${s.id}`);
    tasks.forEach((task, idx) => {
      const tEl = document.createElement('div');
      tEl.className = 'task' + (task.done ? ' done' : '');
      tEl.innerHTML = `
        <div class="checkbox" onclick="toggleTask('${s.id}',${idx}, this)"></div>
        <input type="text" class="task-input" value="${esc(task.text)}" 
               onchange="updateText('${s.id}',${idx},this.value)"
               onfocus="this.select()">
        <button class="delete-btn" onclick="deleteTask('${s.id}',${idx})" title="삭제">−</button>
      `;
      list.appendChild(tEl);
    });
  });
}

function renderMomSection() {
  const container = document.getElementById('momSection');
  const stats = getDayStats(selectedDate);
  const hasReal = hasRealTaskOnDay(selectedDate);
  const allDone = hasReal && stats.done === stats.total;
  const confirmed = state.momConfirmed[selectedDate];
  
  if (state.subjects.length === 0) {
    container.innerHTML = '';
    return;
  }
  
  if (confirmed) {
    container.innerHTML = `
      <div class="mom-card confirmed">
        <div class="mom-confirmed-text">
          참 잘했어요 아들 <span class="heart">💕</span><br>
          <span style="font-size:18px;">엄마가 확인했어요 👩</span>
        </div>
      </div>
    `;
  } else {
    container.innerHTML = `
      <div class="mom-card">
        <div class="mom-title">👩 엄마 확인</div>
        <button class="mom-btn" id="momBtn" onclick="openMomPwd()" ${allDone ? '' : 'disabled'}>
          ${allDone ? '엄마 확인 받기' : '숙제 먼저 완료하기'}
        </button>
      </div>
    `;
  }
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ====== 앱 제목 수정 ====== */
function editAppTitle() {
  const h1 = document.getElementById('appTitle');
  const cur = state.appTitle;
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'header-title-input';
  input.value = cur;
  input.maxLength = 8;
  
  const updateWidth = () => {
    const len = Math.max(input.value.length, 4);
    input.style.width = (len + 1.5) + 'ch';
  };
  
  h1.replaceWith(input);
  updateWidth();
  input.focus();
  input.select();
  
  // 8자 초과 시 잘라내기 (IME 한글 조합도 대응)
  input.addEventListener('input', () => {
    if (input.value.length > 8) {
      input.value = input.value.slice(0, 8);
    }
    updateWidth();
  });
  
  const finish = () => {
    let val = input.value.trim();
    if (val.length > 8) val = val.slice(0, 8);
    if (!val) val = '숙제 체크리스트';
    state.appTitle = val;
    save();
    const newH1 = document.createElement('h1');
    newH1.id = 'appTitle';
    newH1.textContent = val;
    newH1.onclick = editAppTitle;
    input.replaceWith(newH1);
  };
  
  input.addEventListener('blur', finish);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') input.blur();
    if (e.key === 'Escape') { input.value = cur; input.blur(); }
  });
}

/* ====== 과목 관리 ====== */
function openAddSubject() {
  soundClick();
  document.getElementById('newSubjectInput').value = '';
  document.getElementById('addSubjectError').textContent = '';
  document.getElementById('addSubjectModal').classList.add('show');
  setTimeout(() => document.getElementById('newSubjectInput').focus(), 100);
}

function closeAddSubject() {
  document.getElementById('addSubjectModal').classList.remove('show');
}

function addSubject() {
  const name = document.getElementById('newSubjectInput').value.trim();
  const err = document.getElementById('addSubjectError');
  
  if (!name) {
    err.textContent = '과목 이름을 입력하세요';
    soundError();
    return;
  }
  if (name.length > 20) {
    err.textContent = '20자 이내로 입력하세요';
    soundError();
    return;
  }
  if (state.subjects.some(s => s.name === name)) {
    err.textContent = '같은 이름의 과목이 있어요';
    soundError();
    return;
  }
  
  const id = genId();
  state.subjects.push({ id, name, color: randomSubjectColor() });
  ensureDay(selectedDate);
  save();
  soundFanfare();
  closeAddSubject();
  renderAll();
  showToast(`✨ "${name}" 과목 추가됨`);
}

function updateSubjectName(subjectId, newName) {
  const trimmed = newName.trim();
  const s = state.subjects.find(x => x.id === subjectId);
  if (!s) return;
  if (!trimmed) {
    renderAll();
    return;
  }
  s.name = trimmed.slice(0, 20);
  save();
}

function openDeleteSubject(subjectId) {
  soundClick();
  pendingDeleteSubjectId = subjectId;
  const s = state.subjects.find(x => x.id === subjectId);
  if (!s) return;
  document.getElementById('deleteSubjectMsg').textContent = 
    `"${s.name}" 과목 삭제`;
  document.getElementById('deleteSubjectPwd').value = '';
  document.getElementById('deleteSubjectError').textContent = '';
  document.getElementById('deleteSubjectModal').classList.add('show');
  setTimeout(() => document.getElementById('deleteSubjectPwd').focus(), 100);
}

function closeDeleteSubject() {
  document.getElementById('deleteSubjectModal').classList.remove('show');
  pendingDeleteSubjectId = null;
}

function confirmDeleteSubject() {
  const pwd = document.getElementById('deleteSubjectPwd').value;
  const err = document.getElementById('deleteSubjectError');
  
  if (pwd !== state.momPassword) {
    err.textContent = '비밀번호가 틀려요 ❌';
    soundError();
    document.getElementById('deleteSubjectPwd').value = '';
    return;
  }
  
  if (!pendingDeleteSubjectId) return;
  
  // 과목 삭제
  state.subjects = state.subjects.filter(s => s.id !== pendingDeleteSubjectId);
  // 모든 날짜에서 해당 과목 데이터 삭제
  Object.keys(state.tasks).forEach(dk => {
    if (state.tasks[dk] && state.tasks[dk][pendingDeleteSubjectId]) {
      delete state.tasks[dk][pendingDeleteSubjectId];
    }
  });
  
  save();
  soundFanfare();
  closeDeleteSubject();
  renderAll();
  showToast('🗑️ 과목이 삭제되었어요');
}

/* ====== 숙제 ====== */
function toggleTask(subjectId, idx, checkboxEl) {
  const task = state.tasks[selectedDate][subjectId][idx];
  const wasDone = task.done;
  task.done = !task.done;
  
  if (!wasDone && task.done) {
    soundCheck();
    setTimeout(() => soundCoin(), 200);
    addPendingCoin(selectedDate, 1, checkboxEl);
    showDogMsg('잘했어! +1 🪙 (예비)', 2200);
    
    setTimeout(() => {
      const stats = getDayStats(selectedDate);
      if (stats.done === stats.total && stats.total > 0 && !state.bonusGiven[selectedDate]) {
        state.bonusGiven[selectedDate] = true;
        soundBonus();
        addPendingCoin(selectedDate, 5, null);
        showDogMsg('🎉 하루 끝! 보너스 +5 🪙<br>엄마 확인 받자!', 2500);
        save();
        renderMomSection();
        renderCoins();
      }
    }, 700);
  } else if (wasDone && !task.done) {
    soundClick();
    let takeBack = 1;
    let msg = '아쉽다... -1 🪙';
    
    if (state.bonusGiven[selectedDate]) {
      takeBack += 5;
      delete state.bonusGiven[selectedDate];
      msg = '보너스도 회수! -6 🪙';
    }
    if (state.momConfirmed[selectedDate]) {
      delete state.momConfirmed[selectedDate];
      const prevPending = state.pendingCoins[selectedDate] || 0;
      state.coins -= prevPending;
      if (state.coins < 0) state.coins = 0;
      state.pendingCoins[selectedDate] = prevPending;
      msg = '엄마 확인 취소됨. 코인 회수!';
    }
    
    const cur = state.pendingCoins[selectedDate] || 0;
    state.pendingCoins[selectedDate] = Math.max(0, cur - takeBack);
    
    showDogMsg(msg, 1800);
  }
  
  save();
  renderAll();
}

function addPendingCoin(dateKey, amount, fromEl) {
  state.pendingCoins[dateKey] = (state.pendingCoins[dateKey] || 0) + amount;
  
  if (fromEl) {
    const rect = fromEl.getBoundingClientRect();
    const coinDisplay = document.querySelector('.coin-display').getBoundingClientRect();
    
    for (let i = 0; i < Math.min(amount, 3); i++) {
      setTimeout(() => {
        const coin = document.createElement('div');
        coin.className = 'flying-coin';
        coin.textContent = '🪙';
        coin.style.left = rect.left + 'px';
        coin.style.top = rect.top + 'px';
        document.body.appendChild(coin);
        
        requestAnimationFrame(() => {
          coin.style.left = coinDisplay.left + 'px';
          coin.style.top = coinDisplay.top + 'px';
          coin.style.transform = 'scale(0.5) rotate(720deg)';
          coin.style.opacity = '0';
        });
        
        setTimeout(() => coin.remove(), 900);
      }, i * 100);
    }
  }
  renderCoins();
}

function showDogMsg(msg, duration = 2200) {
  if (dogTimer) {
    clearTimeout(dogTimer);
    dogTimer = null;
  }
  const dogReward = document.getElementById('dogReward');
  document.getElementById('dogMsg').innerHTML = msg;
  dogReward.classList.add('show');
  dogTimer = setTimeout(() => {
    dogReward.classList.remove('show');
    dogTimer = null;
  }, duration);
}

function hideDogMsg() {
  const dogReward = document.getElementById('dogReward');
  dogReward.classList.remove('show');
  if (dogTimer) { clearTimeout(dogTimer); dogTimer = null; }
}

function updateText(subjectId, idx, text) {
  state.tasks[selectedDate][subjectId][idx].text = text;
  save();
}

function addTask(subjectId) {
  soundClick();
  state.tasks[selectedDate][subjectId].push({ text: '새 숙제', done: false });
  delete state.bonusGiven[selectedDate];
  delete state.momConfirmed[selectedDate];
  save();
  renderAll();
  showToast('✏️ 숙제가 추가됐어요');
  setTimeout(() => {
    const list = document.getElementById(`list-${subjectId}`);
    const inputs = list.querySelectorAll('.task-input');
    const last = inputs[inputs.length - 1];
    if (last) { last.focus(); last.select(); }
  }, 50);
}

function deleteTask(subjectId, idx) {
  soundClick();
  state.tasks[selectedDate][subjectId].splice(idx, 1);
  if (state.tasks[selectedDate][subjectId].length === 0) {
    state.tasks[selectedDate][subjectId].push({ text: '숙제 내용 입력...', done: false });
  }
  save();
  renderAll();
}

/* ====== 엄마 확인 ====== */
function openMomPwd() {
  soundClick();
  document.getElementById('momPwdInput').value = '';
  document.getElementById('momPwdError').textContent = '';
  document.getElementById('momPwdModal').classList.add('show');
  setTimeout(() => document.getElementById('momPwdInput').focus(), 100);
}

function closeMomPwd() {
  document.getElementById('momPwdModal').classList.remove('show');
}

function checkMomPwd() {
  const input = document.getElementById('momPwdInput').value;
  const err = document.getElementById('momPwdError');
  
  if (input === state.momPassword) {
    state.momConfirmed[selectedDate] = true;
    const pending = state.pendingCoins[selectedDate] || 0;
    state.coins += pending;
    save();
    soundFanfare();
    closeMomPwd();
    if (pending > 0) {
      showDogMsg(`참 잘했어요 아들 💕<br>예비 코인 +${pending} 합산!`, 2800);
    } else {
      showDogMsg('참 잘했어요 아들 💕', 2500);
    }
    renderAll();
  } else {
    err.textContent = '비밀번호가 틀려요 ❌';
    soundError();
    document.getElementById('momPwdInput').value = '';
  }
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('momPwdInput').addEventListener('keypress', e => {
    if (e.key === 'Enter') checkMomPwd();
  });
  document.getElementById('newSubjectInput').addEventListener('keypress', e => {
    if (e.key === 'Enter') addSubject();
  });
  document.getElementById('deleteSubjectPwd').addEventListener('keypress', e => {
    if (e.key === 'Enter') confirmDeleteSubject();
  });
});

/* ====== 설정 ====== */
function openSettings() {
  soundClick();
  document.getElementById('curPwdInput').value = '';
  document.getElementById('newPwdInput').value = '';
  document.getElementById('settingsError').textContent = '';
  document.getElementById('settingsModal').classList.add('show');
}

function closeSettings() {
  document.getElementById('settingsModal').classList.remove('show');
}

function changePwd() {
  const cur = document.getElementById('curPwdInput').value;
  const newP = document.getElementById('newPwdInput').value;
  const err = document.getElementById('settingsError');
  
  if (cur !== state.momPassword) {
    err.textContent = '현재 비밀번호가 틀려요 ❌';
    soundError();
    return;
  }
  if (!/^\d{4}$/.test(newP)) {
    err.textContent = '새 비밀번호는 4자리 숫자여야 해요';
    soundError();
    return;
  }
  
  state.momPassword = newP;
  save();
  soundFanfare();
  closeSettings();
  showToast('🔐 비밀번호가 변경됐어요!');
}

/* ====== 비밀번호 초기화 ====== */

function openResetPwd() {

  closeSettings();
  document.getElementById('masterCodeInput').value = '';
  document.getElementById('resetPwdError').textContent = '';
  document.getElementById('resetPwdModal').classList.add('show');

}

function closeResetPwd() {
  document.getElementById('resetPwdModal').classList.remove('show');
}

function resetPwd() {

/* ====== 상점 ====== */
function openShop() {
  soundClick();
  renderShopItems();
  renderOwned();
  document.getElementById('shopModal').classList.add('show');
}

function closeShop() {
  soundClick();
  document.getElementById('shopModal').classList.remove('show');
}

function renderShopItems() {
  const grid = document.getElementById('shopItemsGrid');
  grid.innerHTML = '';
  if (!state.shopItems || state.shopItems.length === 0) {
    grid.innerHTML = '<div style="grid-column:span 2;text-align:center;font-family:Gaegu,cursive;color:#94A3B8;padding:10px;">상품이 없어요</div>';
    return;
  }
  state.shopItems.forEach(item => {
    const el = document.createElement('div');
    el.className = 'shop-item';
    el.innerHTML = `
      <span class="shop-item-icon">${item.icon || '🎁'}</span>
      <div class="shop-item-name">${esc(item.name)}</div>
      <div class="shop-item-price">${item.price} 🪙</div>
      <div class="shop-item-actions">
        <button class="buy-btn" ${state.coins < item.price ? 'disabled' : ''} onclick="buyItem('${item.id}', ${item.price}, '${esc(item.icon || '🎁')} ${esc(item.name)}')">구매</button>
        <button class="shop-item-delete" onclick="deleteShopItem('${item.id}')" title="삭제">−</button>
      </div>
    `;
    grid.appendChild(el);
  });
}

function renderOwned() {
  const ownedEl = document.getElementById('ownedList');
  const items = [];
  state.shopItems.forEach(item => {
    const cnt = state.tickets[item.id] || 0;
    if (cnt > 0) items.push(`${item.icon || '🎁'} ${item.name} ${cnt}장`);
  });
  // shopItems에서 삭제된 항목이라도 ticket이 있으면 표시
  Object.keys(state.tickets).forEach(tid => {
    if (state.tickets[tid] > 0 && !state.shopItems.some(s => s.id === tid)) {
      items.push(`(삭제됨) ${tid} ${state.tickets[tid]}장`);
    }
  });
  
  if (items.length === 0) {
    ownedEl.innerHTML = '<span class="owned-empty">아직 없어요</span>';
  } else {
    ownedEl.textContent = items.join(' · ');
  }
}

function buyItem(id, price, name) {
  if (state.coins < price) return;
  state.coins -= price;
  state.tickets[id] = (state.tickets[id] || 0) + 1;
  save();
  soundFanfare();
  renderCoins();
  renderShopItems();
  renderOwned();
  showToast(`🎉 ${name} 구매 완료!`);
}

function deleteShopItem(id) {
  soundClick();
  state.shopItems = state.shopItems.filter(s => s.id !== id);
  save();
  renderShopItems();
  renderOwned();
  showToast('🗑️ 상품이 삭제됐어요');
}

/* ===== 상품 추가 (비번 필요) ===== */
function openAddShopItem() {
  soundClick();
  document.getElementById('newShopItemName').value = '';
  document.getElementById('newShopItemPrice').value = '';
  document.getElementById('newShopItemPwd').value = '';
  document.getElementById('addShopItemError').textContent = '';
  document.getElementById('addShopItemModal').classList.add('show');
  setTimeout(() => document.getElementById('newShopItemName').focus(), 100);
}

function closeAddShopItem() {
  document.getElementById('addShopItemModal').classList.remove('show');
}

function addShopItem() {
  const name = document.getElementById('newShopItemName').value.trim();
  const priceStr = document.getElementById('newShopItemPrice').value.trim();
  const pwd = document.getElementById('newShopItemPwd').value;
  const err = document.getElementById('addShopItemError');
  
  if (!name) {
    err.textContent = '상품 이름을 입력하세요';
    soundError();
    return;
  }
  const price = parseInt(priceStr);
  if (isNaN(price) || price < 1) {
    err.textContent = '가격을 올바로 입력하세요';
    soundError();
    return;
  }
  if (pwd !== state.momPassword) {
    err.textContent = '비밀번호가 틀려요 ❌';
    soundError();
    return;
  }
  
  const id = 'item_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  state.shopItems.push({ id, name, icon: '🎁', price });
  save();
  soundFanfare();
  closeAddShopItem();
  renderShopItems();
  renderOwned();
  showToast(`✨ "${name}" 추가됨`);
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 1800);
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}

document.addEventListener('touchstart', initAudio, { once: true });
document.addEventListener('click', initAudio, { once: true });

load();
