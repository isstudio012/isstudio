<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>360° VR Gallery</title>

<!-- ===== Photo Sphere Viewer v5 (최신) ===== -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5/index.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/markers-plugin@5/index.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/virtual-tour-plugin@5/index.min.css" />

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; height: 100vh; overflow: hidden; }
  body {
    color: #fff;
    font-family: -apple-system, "Apple SD Gothic Neo", "Pretendard", sans-serif;
  }

  /* ===== 갤러리: 5열 × 2행 = 화면 꽉 채움 ===== */
  .gallery {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 4px;
    width: 100vw;
    height: 100vh;
  }
  .card {
    position: relative;
    overflow: hidden;
    cursor: pointer;
    background: #0a0a0a;
    transition: transform 0.25s ease;
  }
  .card:hover { transform: scale(1.015); z-index: 2; }

  .card img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    filter: grayscale(100%) brightness(0.95);
    transition: filter 0.35s ease;
  }
  .card:hover img { filter: grayscale(0%) brightness(1.05); }

  .card .label {
    position: absolute;
    bottom: 14px;
    left: 16px;
    font-size: 14px;
    color: #fff;
    text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    letter-spacing: 0.02em;
    z-index: 2;
  }
  .card .delete-btn {
    position: absolute;
    top: 10px; right: 10px;
    background: rgba(0,0,0,0.5);
    color: #fff;
    border: none;
    width: 26px; height: 26px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.2s, background 0.2s;
    z-index: 3;
  }
  .card:hover .delete-btn { opacity: 1; }
  .card .delete-btn:hover { background: rgba(220,50,50,0.9); }

  .placeholder {
    width: 100%; height: 100%;
    background: linear-gradient(135deg, #2a2a3a, #1c1c28);
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.3);
    font-size: 11px;
  }

  /* ===== VR 뷰어 모달 ===== */
  .viewer {
    display: none;
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 1000;
  }
  .viewer.active { display: block; }
  #psv-container { width: 100%; height: 100%; }

  /* 좌상단 제목 */
  .viewer-title-bar {
    position: absolute;
    top: 0; left: 0;
    padding: 20px 30px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 14px;
    color: #fff;
    font-size: 14px;
    pointer-events: none;
  }
  .viewer-title-bar .dot {
    width: 8px; height: 8px;
    background: #ff3b3b;
    border-radius: 50%;
  }
  .viewer-title-bar .sep { color: #555; }

  /* 상단 컨트롤 바 (가운데) */
  .top-controls {
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    z-index: 100;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(10px);
    padding: 6px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .ctrl-btn {
    background: transparent;
    border: none;
    color: #fff;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
    font-family: inherit;
  }
  .ctrl-btn:hover { background: rgba(255,255,255,0.15); }
  .ctrl-btn.active {
    background: rgba(74, 222, 128, 0.3);
    color: #4ade80;
  }

  /* 우상단 닫기 */
  .close-btn {
    position: absolute;
    top: 20px; right: 20px;
    background: rgba(0,0,0,0.4);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.15);
    color: #fff;
    width: 40px; height: 40px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    transition: background 0.2s;
  }
  .close-btn:hover { background: rgba(220,50,50,0.7); }

  /* 좌하단 안내 */
  .viewer-hint {
    position: absolute;
    bottom: 20px; left: 30px;
    color: rgba(255,255,255,0.45);
    font-size: 12px;
    z-index: 100;
    pointer-events: none;
  }

  /* 업로드 버튼 */
  .upload-btn {
    position: fixed;
    bottom: 30px; left: 30px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.15);
    color: #fff;
    padding: 12px 22px;
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    z-index: 500;
    font-family: inherit;
    transition: background 0.2s;
  }
  .upload-btn:hover { background: rgba(255,255,255,0.18); }
  .upload-btn .dot-indicator {
    width: 6px; height: 6px;
    background: #4ade80;
    border-radius: 50%;
  }
  #fileInput { display: none; }

  /* 토스트 */
  .toast {
    position: fixed;
    bottom: 100px; left: 30px;
    background: rgba(20,20,20,0.95);
    border: 1px solid rgba(255,255,255,0.12);
    color: #fff;
    padding: 12px 18px;
    border-radius: 8px;
    font-size: 12px;
    z-index: 600;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateY(0); }

  /* PSV 기본 네비게이션 바 숨김 (우리 커스텀 컨트롤만 보이게) */
  .psv-navbar { display: none !important; }
</style>
</head>
<body>

<div class="gallery" id="gallery"></div>

<!-- VR 뷰어 모달 -->
<div class="viewer" id="viewer">
  <div id="psv-container"></div>

  <!-- 좌상단 제목 -->
  <div class="viewer-title-bar">
    <span class="dot"></span>
    <span>360° VR</span>
    <span class="sep">|</span>
    <span id="viewerTitle">-</span>
  </div>

  <!-- 상단 가운데 컨트롤 -->
  <div class="top-controls">
    <button class="ctrl-btn" onclick="zoomIn()" title="줌 인">+</button>
    <button class="ctrl-btn" onclick="zoomOut()" title="줌 아웃">−</button>
    <button class="ctrl-btn active" id="autoRotateBtn" onclick="toggleAutoRotate()" title="자동 회전">↻</button>
    <button class="ctrl-btn" onclick="resetView()" title="정렬 (초기 위치)">⌂</button>
  </div>

  <!-- 우상단 닫기 -->
  <button class="close-btn" onclick="closeViewer()">✕</button>

  <!-- 좌하단 안내 -->
  <div class="viewer-hint">⊕ 드래그하여 둘러보기 · 휠로 줌 · 점 클릭해 이동</div>
</div>

<!-- 업로드 -->
<button class="upload-btn" onclick="document.getElementById('fileInput').click()">
  <span class="dot-indicator"></span>
  ⬆ 360° VR 업로드
</button>
<input type="file" id="fileInput" accept="image/*" multiple onchange="handleUpload(event)" />

<div class="toast" id="toast"></div>

<!-- ===== Photo Sphere Viewer 라이브러리 (ES Module) ===== -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "@photo-sphere-viewer/core": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core@5/index.module.js",
    "@photo-sphere-viewer/markers-plugin": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/markers-plugin@5/index.module.js",
    "@photo-sphere-viewer/virtual-tour-plugin": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/virtual-tour-plugin@5/index.module.js",
    "@photo-sphere-viewer/autorotate-plugin": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/autorotate-plugin@5/index.module.js"
  }
}
</script>

<script type="module">
import { Viewer } from '@photo-sphere-viewer/core';
import { MarkersPlugin } from '@photo-sphere-viewer/markers-plugin';
import { VirtualTourPlugin } from '@photo-sphere-viewer/virtual-tour-plugin';
import { AutorotatePlugin } from '@photo-sphere-viewer/autorotate-plugin';

/* ============================================================
   ★ 기본 장면 (영구) ★
   폴더(images/)에 이미지 넣고 아래 배열에 등록하면
   새로고침해도 유지됨.

   예시:
   {
     id: "room1",
     title: "거실",
     panorama: "images/pano1.jpg",
     thumb: "images/thumb1.jpg",
     links: [{ nodeId: "room2" }]  // room2로 이동하는 핫스팟
   }
============================================================ */
const baseScenes = [];

/* 업로드 장면 (메모리, 새로고침 시 사라짐) */
let uploadedScenes = [];

function getAllScenes() {
  return [...baseScenes, ...uploadedScenes];
}

/* ============================================================
   갤러리 렌더링
============================================================ */
function renderGallery() {
  const gallery = document.getElementById("gallery");
  gallery.innerHTML = "";
  const all = getAllScenes();

  all.forEach(scene => {
    const card = document.createElement("div");
    card.className = "card";
    card.onclick = (e) => {
      if (e.target.classList.contains("delete-btn")) return;
      openViewer(scene.id);
    };

    const thumbSrc = scene.thumb || scene.panorama;
    const isUploaded = scene.id.startsWith("upload_");

    card.innerHTML = `
      <img src="${thumbSrc}" alt="${scene.title}"
           onerror="this.outerHTML='<div class=\\'placeholder\\'>이미지 없음</div>'" />
      ${isUploaded ? `<button class="delete-btn" data-id="${scene.id}">✕</button>` : ""}
      <div class="label">${scene.title}</div>
    `;
    gallery.appendChild(card);
  });

  // 삭제 버튼 이벤트
  gallery.querySelectorAll(".delete-btn").forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const id = btn.dataset.id;
      uploadedScenes = uploadedScenes.filter(s => s.id !== id);
      renderGallery();
    };
  });
}

/* ============================================================
   VR 뷰어 (Photo Sphere Viewer + Virtual Tour)
============================================================ */
let psv = null;
let isAutoRotating = true;

function openViewer(sceneId) {
  const all = getAllScenes();
  const startScene = all.find(s => s.id === sceneId);
  if (!startScene) return;

  document.getElementById("viewer").classList.add("active");
  document.getElementById("viewerTitle").textContent = startScene.title;

  // 가상 투어 노드 만들기 (모든 장면 = 노드)
  const nodes = all.map((s, idx) => {
    // 자동 핫스팟 생성: 같은 갤러리의 다른 장면들로 연결
    const otherScenes = all.filter(other => other.id !== s.id);
    const links = otherScenes.slice(0, 3).map((target, i) => ({
      nodeId: target.id,
      // 핫스팟 위치를 360도 균등 분배
      position: {
        yaw: (i + 1) * (360 / (otherScenes.length + 1)) + "deg",
        pitch: "0deg"
      }
    }));

    return {
      id: s.id,
      panorama: s.panorama,
      thumbnail: s.thumb || s.panorama,
      name: s.title,
      caption: s.title,
      links: s.links || links  // 직접 정의한 links가 있으면 그거 우선
    };
  });

  // 기존 뷰어 제거
  if (psv) {
    psv.destroy();
    psv = null;
  }

  // 새 뷰어 생성
  psv = new Viewer({
    container: document.getElementById("psv-container"),
    plugins: [
      MarkersPlugin,
      [AutorotatePlugin, {
        autorotateSpeed: "1rpm",
        autostartDelay: 1500,
        autostartOnIdle: false
      }],
      [VirtualTourPlugin, {
        positionMode: 'manual',
        renderMode: 'markers',
      }],
    ],
    defaultZoomLvl: 30,
    minFov: 20,
    maxFov: 100,
    navbar: false,
    loadingTxt: "로딩 중...",
  });

  const tour = psv.getPlugin(VirtualTourPlugin);
  tour.setNodes(nodes, sceneId);

  // 자동 회전 시작
  const autorotate = psv.getPlugin(AutorotatePlugin);
  setTimeout(() => {
    autorotate.start();
    isAutoRotating = true;
    document.getElementById("autoRotateBtn").classList.add("active");
  }, 800);

  // 장면 전환 시 제목 업데이트
  tour.addEventListener('node-changed', ({ node }) => {
    document.getElementById("viewerTitle").textContent = node.name || node.id;
  });
}

function closeViewer() {
  document.getElementById("viewer").classList.remove("active");
  if (psv) {
    psv.destroy();
    psv = null;
  }
}

/* 컨트롤 함수들 (window에 노출) */
window.zoomIn = () => {
  if (!psv) return;
  psv.zoom(psv.getZoomLevel() + 10);
};
window.zoomOut = () => {
  if (!psv) return;
  psv.zoom(psv.getZoomLevel() - 10);
};
window.toggleAutoRotate = () => {
  if (!psv) return;
  const ar = psv.getPlugin(AutorotatePlugin);
  if (isAutoRotating) {
    ar.stop();
    isAutoRotating = false;
    document.getElementById("autoRotateBtn").classList.remove("active");
  } else {
    ar.start();
    isAutoRotating = true;
    document.getElementById("autoRotateBtn").classList.add("active");
  }
};
window.resetView = () => {
  if (!psv) return;
  psv.animate({
    yaw: 0,
    pitch: 0,
    zoom: 30,
    speed: '2rpm'
  });
};
window.closeViewer = closeViewer;
window.openViewer = openViewer;

document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeViewer();
});

/* ============================================================
   업로드
============================================================ */
window.handleUpload = function(event) {
  const files = Array.from(event.target.files);
  if (files.length === 0) return;

  let addedCount = 0;
  files.forEach(file => {
    if (!file.type.startsWith("image/")) return;
    const url = URL.createObjectURL(file);
    const id = "upload_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7);
    const name = file.name.replace(/\.[^.]+$/, "");
    uploadedScenes.push({
      id: id,
      title: name,
      panorama: url,
      thumb: url
    });
    addedCount++;
  });

  renderGallery();
  showToast(`${addedCount}개 추가됨${addedCount >= 2 ? " · 점 클릭으로 이동 가능" : ""}`);
  event.target.value = "";
};

/* 토스트 */
let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2800);
}

renderGallery();
</script>

</body>
</html>
