<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>360° VR Gallery</title>

<!-- ===== PSV v5 CSS ===== -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core/index.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/markers-plugin/index.min.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/virtual-tour-plugin/index.min.css" />

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #000; height: 100vh; overflow: hidden; }
  body {
    color: #fff;
    font-family: -apple-system, "Apple SD Gothic Neo", "Pretendard", sans-serif;
  }

  .gallery {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 4px;
    width: 100vw;
    height: 100vh;
  }
  .card {
    position: relative;
    overflow: hidden;
    cursor: pointer;
    background: #0a0a0a;
    transition: transform 0.25s ease;
  }
  .card:hover { transform: scale(1.015); z-index: 2; }

  .card img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    filter: grayscale(100%) brightness(0.95);
    transition: filter 0.35s ease;
  }
  .card:hover img { filter: grayscale(0%) brightness(1.05); }

  .card .label {
    position: absolute;
    bottom: 14px;
    left: 16px;
    font-size: 14px;
    color: #fff;
    text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    z-index: 2;
  }
  .card .delete-btn {
    position: absolute;
    top: 10px; right: 10px;
    background: rgba(0,0,0,0.5);
    color: #fff;
    border: none;
    width: 26px; height: 26px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.2s, background 0.2s;
    z-index: 3;
  }
  .card:hover .delete-btn { opacity: 1; }
  .card .delete-btn:hover { background: rgba(220,50,50,0.9); }

  .viewer {
    display: none;
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 1000;
  }
  .viewer.active { display: block; }
  #psv-container { width: 100%; height: 100%; }

  .viewer-title-bar {
    position: absolute;
    top: 0; left: 0;
    padding: 20px 30px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 14px;
    color: #fff;
    font-size: 14px;
    pointer-events: none;
  }
  .viewer-title-bar .dot { width: 8px; height: 8px; background: #ff3b3b; border-radius: 50%; }
  .viewer-title-bar .sep { color: #555; }

  .top-controls {
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 4px;
    z-index: 100;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(10px);
    padding: 6px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .ctrl-btn {
    background: transparent;
    border: none;
    color: #fff;
    width: 36px; height: 36px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s;
    font-family: inherit;
  }
  .ctrl-btn:hover { background: rgba(255,255,255,0.15); }
  .ctrl-btn.active { background: rgba(74, 222, 128, 0.3); color: #4ade80; }

  .close-btn {
    position: absolute;
    top: 20px; right: 20px;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.15);
    color: #fff;
    width: 40px; height: 40px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
  }
  .close-btn:hover { background: rgba(220,50,50,0.7); }

  .viewer-hint {
    position: absolute;
    bottom: 20px; left: 30px;
    color: rgba(255,255,255,0.45);
    font-size: 12px;
    z-index: 100;
    pointer-events: none;
  }

  /* 에러 표시 */
  .viewer-error {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    color: #ff6b6b;
    font-size: 14px;
    z-index: 50;
    padding: 40px;
    text-align: center;
  }
  .viewer-error.show { display: flex; }

  .upload-btn {
    position: fixed;
    bottom: 30px; left: 30px;
    background: rgba(255,255,255,0.08);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.15);
    color: #fff;
    padding: 12px 22px;
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    z-index: 500;
    font-family: inherit;
  }
  .upload-btn:hover { background: rgba(255,255,255,0.18); }
  .upload-btn .dot-indicator { width: 6px; height: 6px; background: #4ade80; border-radius: 50%; }
  #fileInput { display: none; }

  .clear-btn {
    position: fixed;
    bottom: 30px;
    left: 220px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.6);
    padding: 12px 18px;
    border-radius: 999px;
    font-size: 12px;
    cursor: pointer;
    z-index: 500;
    font-family: inherit;
    display: none;
  }
  .clear-btn.show { display: block; }
  .clear-btn:hover { color: #fff; background: rgba(220,50,50,0.3); }

  .toast {
    position: fixed;
    bottom: 100px; left: 30px;
    background: rgba(20,20,20,0.95);
    border: 1px solid rgba(255,255,255,0.12);
    color: #fff;
    padding: 12px 18px;
    border-radius: 8px;
    font-size: 12px;
    z-index: 600;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.3s;
    pointer-events: none;
    max-width: 360px;
  }
  .toast.show { opacity: 1; transform: translateY(0); }

  /* 로딩 인디케이터 */
  .lib-loading {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.5);
    font-size: 11px;
    z-index: 600;
  }

  .psv-navbar { display: none !important; }
</style>
</head>
<body>

<div class="gallery" id="gallery"></div>

<div class="viewer" id="viewer">
  <div id="psv-container"></div>

  <div class="viewer-error" id="viewerError"></div>

  <div class="viewer-title-bar">
    <span class="dot"></span>
    <span>360° VR</span>
    <span class="sep">|</span>
    <span id="viewerTitle">-</span>
  </div>

  <div class="top-controls">
    <button class="ctrl-btn" onclick="window.zoomIn()" title="줌 인">+</button>
    <button class="ctrl-btn" onclick="window.zoomOut()" title="줌 아웃">−</button>
    <button class="ctrl-btn active" id="autoRotateBtn" onclick="window.toggleAutoRotate()" title="자동 회전">↻</button>
    <button class="ctrl-btn" onclick="window.resetView()" title="정렬">⌂</button>
  </div>

  <button class="close-btn" onclick="window.closeViewer()">✕</button>

  <div class="viewer-hint">⊕ 드래그하여 둘러보기 · 휠로 줌 · 점 클릭해 이동</div>
</div>

<button class="upload-btn" onclick="document.getElementById('fileInput').click()">
  <span class="dot-indicator"></span>
  ⬆ 360° VR 업로드
</button>
<input type="file" id="fileInput" accept="image/*" multiple />

<button class="clear-btn" id="clearBtn">모두 지우기</button>

<div class="toast" id="toast"></div>

<!-- ===== PSV v5 ES Module (공식 권장 방식, 버전 자동 최신) ===== -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three/build/three.module.js",
    "@photo-sphere-viewer/core": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/core/index.module.js",
    "@photo-sphere-viewer/markers-plugin": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/markers-plugin/index.module.js",
    "@photo-sphere-viewer/virtual-tour-plugin": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/virtual-tour-plugin/index.module.js",
    "@photo-sphere-viewer/autorotate-plugin": "https://cdn.jsdelivr.net/npm/@photo-sphere-viewer/autorotate-plugin/index.module.js"
  }
}
</script>

<script type="module">
let Viewer, MarkersPlugin, VirtualTourPlugin, AutorotatePlugin;
let libsReady = false;
let libLoadError = null;

// 라이브러리 로딩 (에러 핸들링 포함)
try {
  const core = await import('@photo-sphere-viewer/core');
  const markers = await import('@photo-sphere-viewer/markers-plugin');
  const tour = await import('@photo-sphere-viewer/virtual-tour-plugin');
  const autorot = await import('@photo-sphere-viewer/autorotate-plugin');

  Viewer = core.Viewer;
  MarkersPlugin = markers.MarkersPlugin;
  VirtualTourPlugin = tour.VirtualTourPlugin;
  AutorotatePlugin = autorot.AutorotatePlugin;

  libsReady = true;
  console.log("PSV libraries loaded successfully");
} catch (e) {
  libLoadError = e.message || String(e);
  console.error("PSV library load failed:", e);
}

/* ============================================================
   ★ 기본 장면 (영구 코드) ★
============================================================ */
const baseScenes = [];

/* localStorage 저장 */
const STORAGE_KEY = "vr_gallery_uploads_v1";
let uploadedScenes = loadFromStorage();

function loadFromStorage() {
  try {
    const data = localStorage.getItem(STORAGE_KEY);
    if (!data) return [];
    return JSON.parse(data);
  } catch (e) {
    return [];
  }
}

function saveToStorage() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(uploadedScenes));
  } catch (e) {
    showToast("저장 용량 초과 - 일부 이미지가 저장 안됨");
  }
}

function getAllScenes() {
  return [...baseScenes, ...uploadedScenes];
}

/* 갤러리 렌더링 */
function renderGallery() {
  const gallery = document.getElementById("gallery");
  gallery.innerHTML = "";
  const all = getAllScenes();

  all.forEach(scene => {
    const card = document.createElement("div");
    card.className = "card";
    card.onclick = (e) => {
      if (e.target.classList.contains("delete-btn")) return;
      openViewer(scene.id);
    };

    const thumbSrc = scene.thumb || scene.panorama;
    const isUploaded = scene.id.startsWith("upload_");

    card.innerHTML = `
      <img src="${thumbSrc}" alt="${scene.title}" />
      ${isUploaded ? `<button class="delete-btn" data-id="${scene.id}">✕</button>` : ""}
      <div class="label">${scene.title}</div>
    `;
    gallery.appendChild(card);
  });

  gallery.querySelectorAll(".delete-btn").forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const id = btn.dataset.id;
      uploadedScenes = uploadedScenes.filter(s => s.id !== id);
      saveToStorage();
      renderGallery();
    };
  });

  const clearBtn = document.getElementById("clearBtn");
  if (uploadedScenes.length > 0) {
    clearBtn.classList.add("show");
  } else {
    clearBtn.classList.remove("show");
  }
}

/* VR 뷰어 */
let psv = null;
let isAutoRotating = true;

function openViewer(sceneId) {
  const all = getAllScenes();
  const startScene = all.find(s => s.id === sceneId);
  if (!startScene) return;

  document.getElementById("viewer").classList.add("active");
  document.getElementById("viewerTitle").textContent = startScene.title;
  document.getElementById("viewerError").classList.remove("show");

  // 라이브러리 로딩 실패 시
  if (!libsReady) {
    const errEl = document.getElementById("viewerError");
    errEl.textContent = "VR 라이브러리 로드 실패: " + (libLoadError || "알 수 없는 오류") +
                        "\n인터넷 연결 또는 CDN 차단 여부를 확인하세요.";
    errEl.classList.add("show");
    return;
  }

  // 가상 투어 노드
  const nodes = all.map(s => {
    const others = all.filter(o => o.id !== s.id);
    const links = (s.links && s.links.length > 0) ? s.links : others.slice(0, 4).map((target, i) => ({
      nodeId: target.id,
      position: {
        yaw: ((i + 1) * (360 / (Math.min(others.length, 4) + 1))) + "deg",
        pitch: "-5deg"
      }
    }));

    return {
      id: s.id,
      panorama: s.panorama,
      thumbnail: s.thumb || s.panorama,
      name: s.title,
      caption: s.title,
      links: links
    };
  });

  if (psv) {
    psv.destroy();
    psv = null;
  }

  try {
    psv = new Viewer({
      container: document.getElementById("psv-container"),
      plugins: [
        MarkersPlugin,
        AutorotatePlugin.withConfig({
          autorotateSpeed: "0.8rpm",
          autostartDelay: 1000,
          autostartOnIdle: false
        }),
        VirtualTourPlugin.withConfig({
          positionMode: 'manual',
        }),
      ],
      defaultZoomLvl: 30,
      minFov: 20,
      maxFov: 100,
      navbar: false,
    });

    const tourPlugin = psv.getPlugin(VirtualTourPlugin);
    tourPlugin.setNodes(nodes, sceneId);

    const ar = psv.getPlugin(AutorotatePlugin);
    setTimeout(() => {
      ar.start();
      isAutoRotating = true;
      document.getElementById("autoRotateBtn").classList.add("active");
    }, 1000);

    tourPlugin.addEventListener('node-changed', ({ node }) => {
      document.getElementById("viewerTitle").textContent = node.name || node.id;
    });
  } catch (e) {
    console.error("뷰어 생성 실패:", e);
    const errEl = document.getElementById("viewerError");
    errEl.textContent = "뷰어 생성 실패: " + e.message;
    errEl.classList.add("show");
  }
}

function closeViewer() {
  document.getElementById("viewer").classList.remove("active");
  if (psv) {
    try { psv.destroy(); } catch (e) {}
    psv = null;
  }
}

window.zoomIn = () => {
  if (!psv) return;
  psv.zoom(psv.getZoomLevel() + 10);
};
window.zoomOut = () => {
  if (!psv) return;
  psv.zoom(psv.getZoomLevel() - 10);
};
window.toggleAutoRotate = () => {
  if (!psv || !libsReady) return;
  const ar = psv.getPlugin(AutorotatePlugin);
  if (isAutoRotating) {
    ar.stop();
    isAutoRotating = false;
    document.getElementById("autoRotateBtn").classList.remove("active");
  } else {
    ar.start();
    isAutoRotating = true;
    document.getElementById("autoRotateBtn").classList.add("active");
  }
};
window.resetView = () => {
  if (!psv) return;
  psv.animate({
    yaw: 0,
    pitch: 0,
    zoom: 30,
    speed: '2rpm'
  });
};
window.closeViewer = closeViewer;

document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeViewer();
});

/* 업로드 */
function handleUpload(event) {
  const files = Array.from(event.target.files);
  if (files.length === 0) return;

  showToast(`${files.length}개 변환 중...`);
  let processed = 0;
  let addedCount = 0;

  files.forEach(file => {
    if (!file.type.startsWith("image/")) {
      processed++;
      return;
    }

    const reader = new FileReader();
    reader.onload = (e) => {
      const base64 = e.target.result;
      const id = "upload_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7);
      const name = file.name.replace(/\.[^.]+$/, "");

      uploadedScenes.push({
        id: id,
        title: name,
        panorama: base64,
        thumb: base64
      });

      addedCount++;
      processed++;

      if (processed === files.length) {
        saveToStorage();
        renderGallery();
        const note = addedCount >= 2 ? " · 점 클릭으로 이동 가능" : "";
        showToast(`${addedCount}개 추가됨 · 새로고침해도 유지${note}`);
      }
    };
    reader.onerror = () => {
      processed++;
      if (processed === files.length) {
        saveToStorage();
        renderGallery();
      }
    };
    reader.readAsDataURL(file);
  });

  event.target.value = "";
}

function clearAll() {
  if (!confirm("업로드한 모든 이미지를 삭제할까요?")) return;
  uploadedScenes = [];
  localStorage.removeItem(STORAGE_KEY);
  renderGallery();
  showToast("모두 삭제됨");
}

let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 3000);
}

// 이벤트 바인딩
document.getElementById("fileInput").addEventListener("change", handleUpload);
document.getElementById("clearBtn").addEventListener("click", clearAll);

// 시작
renderGallery();

// 라이브러리 로드 실패 시 사용자에게 알림
if (!libsReady) {
  showToast("VR 라이브러리 로딩 실패 - 새로고침 또는 인터넷 확인");
}
</script>

</body>
</html>
